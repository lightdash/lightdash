name: Publish E2B template

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      template_directory:
        required: true
        type: string
      template_name:
        required: true
        type: string
      template_name_env:
        required: true
        type: string
      template_tag_env:
        required: true
        type: string
      template_extra_tags_env:
        required: true
        type: string
      template_source_tag_env:
        required: true
        type: string
      additional_watch_paths:
        default: ''
        type: string
      install_root_deps:
        default: false
        type: boolean
      e2b_domain:
        default: ''
        type: string
    secrets:
      e2b_api_key:
        required: true

jobs:
  publish:
    runs-on: depot-ubuntu-24.04-4
    env:
      E2B_API_KEY: ${{ secrets.e2b_api_key }}
      E2B_DOMAIN: ${{ inputs.e2b_domain }}
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag }}

      - name: Plan build
        id: plan
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          TEMPLATE_DIRECTORY: ${{ inputs.template_directory }}
          ADDITIONAL_WATCH_PATHS: ${{ inputs.additional_watch_paths }}
        run: |
          set -euo pipefail
          WATCH_PATHS=("$TEMPLATE_DIRECTORY")
          while IFS= read -r watch_path; do
            [ -n "$watch_path" ] && WATCH_PATHS+=("$watch_path")
          done <<< "$ADDITIONAL_WATCH_PATHS"
          STATUS=0
          CHANGED=$(.github/scripts/sandbox-image-changes.sh "$RELEASE_TAG" "${WATCH_PATHS[@]}") || STATUS=$?
          if [ "$STATUS" -eq 10 ]; then
            echo "No previous tag found — performing full build"
            ACTION="build"
          elif [ "$STATUS" -ne 0 ]; then
            exit "$STATUS"
          elif [ -n "$CHANGED" ]; then
            echo "Template changed — performing full build"
            echo "$CHANGED"
            ACTION="build"
          else
            echo "No template changes — re-tagging :latest"
            ACTION="retag"
          fi
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"

      # Install Node with actions/setup-node rather than pnpm's runtime
      # manager. setup-node checks the runner tool cache and the
      # actions/node-versions mirror first and retries transient 5xx
      # responses from nodejs.org; pnpm's installer does neither, and one
      # 502 fetching SHASUMS256.txt.sig failed the 2.574.0 US data-app
      # publish, leaving every data-app build on that version without a
      # template tag. The version matches devEngines in the root package.json,
      # so pnpm reuses it instead of downloading its own copy.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          cache: true
          cache-dependency-path: |
            pnpm-lock.yaml
            ${{ inputs.template_directory }}/pnpm-lock.yaml
          install: false

      - name: Install root deps
        if: steps.plan.outputs.action == 'build' && inputs.install_root_deps
        run: pnpm install --frozen-lockfile --prefer-offline --network-concurrency=16

      - name: Install sandbox deps
        working-directory: ${{ inputs.template_directory }}
        run: pnpm install --frozen-lockfile --prefer-offline --network-concurrency=16

      - name: Build and publish template
        if: steps.plan.outputs.action == 'build'
        working-directory: ${{ inputs.template_directory }}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          TEMPLATE_NAME: ${{ inputs.template_name }}
          TEMPLATE_NAME_ENV: ${{ inputs.template_name_env }}
          TEMPLATE_TAG_ENV: ${{ inputs.template_tag_env }}
          TEMPLATE_EXTRA_TAGS_ENV: ${{ inputs.template_extra_tags_env }}
        run: |
          env \
            "$TEMPLATE_NAME_ENV=$TEMPLATE_NAME" \
            "$TEMPLATE_TAG_ENV=$RELEASE_TAG" \
            "$TEMPLATE_EXTRA_TAGS_ENV=latest" \
            pnpm run build

      - name: Re-tag latest build with release version
        if: steps.plan.outputs.action == 'retag'
        working-directory: ${{ inputs.template_directory }}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          TEMPLATE_NAME: ${{ inputs.template_name }}
          TEMPLATE_NAME_ENV: ${{ inputs.template_name_env }}
          TEMPLATE_TAG_ENV: ${{ inputs.template_tag_env }}
          TEMPLATE_SOURCE_TAG_ENV: ${{ inputs.template_source_tag_env }}
        run: |
          env \
            "$TEMPLATE_NAME_ENV=$TEMPLATE_NAME" \
            "$TEMPLATE_TAG_ENV=$RELEASE_TAG" \
            "$TEMPLATE_SOURCE_TAG_ENV=latest" \
            pnpm exec tsx assign-tag.ts
