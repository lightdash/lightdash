name: Deploy Linear agent

on:
  push:
    branches: [main]
    paths:
      - "linear-agent/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-linear-agent
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to exe.dev
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 120
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install deployment dependencies
        run: |
          set -euo pipefail
          missing=()
          command -v dig >/dev/null || missing+=(dnsutils)
          command -v jq >/dev/null || missing+=(jq)
          if [ "${#missing[@]}" -gt 0 ]; then
            sudo apt-get update
            sudo apt-get install --yes "${missing[@]}"
          fi

      - name: Configure exe.dev SSH access
        env:
          EXE_SSH_PRIVATE_KEY: ${{ secrets.LINEAR_AGENT_EXE_SSH_PRIVATE_KEY }}
          EXE_SSH_KNOWN_HOSTS: ${{ secrets.LINEAR_AGENT_EXE_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in EXE_SSH_PRIVATE_KEY EXE_SSH_KNOWN_HOSTS; do
            [ -n "${!name:-}" ] || { echo "Missing required secret: $name" >&2; exit 1; }
          done
          install -d -m 700 ~/.ssh
          printf '%s\n' "$EXE_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$EXE_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          ssh-keygen -F exe.dev -f ~/.ssh/known_hosts >/dev/null
          printf '%s\n' \
            'Host exe.dev *.exe.xyz' \
            '  IdentitiesOnly yes' \
            '  IdentityFile ~/.ssh/id_ed25519' > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Refresh runner template
        env:
          EXE_API_KEY: ${{ secrets.LINEAR_AGENT_EXE_API_KEY }}
        run: ./linear-agent/deploy-linear-exe-agent.sh prepare-template --from-environment

      - name: Deploy controller
        env:
          EXE_API_KEY: ${{ secrets.LINEAR_AGENT_EXE_API_KEY }}
          LINEAR_CLIENT_ID: ${{ secrets.LINEAR_AGENT_CLIENT_ID }}
          LINEAR_CLIENT_SECRET: ${{ secrets.LINEAR_AGENT_CLIENT_SECRET }}
          LINEAR_WEBHOOK_SECRET: ${{ secrets.LINEAR_AGENT_WEBHOOK_SECRET }}
          CODEX_API_KEY: ${{ secrets.LINEAR_AGENT_CODEX_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.LINEAR_AGENT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for name in EXE_API_KEY LINEAR_CLIENT_ID LINEAR_CLIENT_SECRET \
            LINEAR_WEBHOOK_SECRET CODEX_API_KEY GITHUB_TOKEN; do
            [ -n "${!name:-}" ] || { echo "Missing required secret: $name" >&2; exit 1; }
          done
          ./linear-agent/deploy-linear-exe-agent.sh deploy --from-environment
