name: Scope tours docs refresh

# Moves the docs pin forward (scripts/scope-tours/docs-pin.txt). The scope
# walkthrough check reads the docs at the pinned commit, so a docs edit reaches
# the walkthroughs only through a bump. This job runs the bump against the
# latest docs. When the text or order learners see would change, or the bump
# stops because a citation broke, it opens one pull request for the Learn
# owners. When nothing would change it opens nothing and the pin stays put.
#
# The bump follows a cited text that only moved inside its docs section: it
# rewrites the citation in the frontend source file, and the pull request
# holds that file too. A move on its own changes nothing learners see, so it
# opens no pull request.
#
# One refresh pull request is open at a time. While it is open the job does not
# run the bump, so a fix pushed to that pull request is never overwritten.
#
# The pull request is opened with a GitHub App token, because a pull request
# opened with GITHUB_TOKEN does not start CI. The token is created after every
# script has run, and only on the schedule or a manual run from main. The job
# makes the commit through the API, so GitHub signs it: main takes signed
# commits only.
#
# pr.yml skips the preview, and the E2E suites that need it, for a pull request
# the Renovate app opened. The body carries the deploy-preview keyword, which
# asks for the preview, so a refresh is tested like any other change to the
# same files.
#
# On a pull request that changes this file the job runs the bump and prints
# the pull request it would open. It creates no token, pushes nothing and
# opens nothing.

on:
    schedule:
        - cron: '0 6 * * 1-5'
    workflow_dispatch:
    pull_request:
        paths:
            - '.github/workflows/scope-tours-docs-refresh.yml'
            - 'scripts/scope-tours/bump-docs-pin.ts'
            - 'scripts/scope-tours/citation-moves.ts'

permissions:
    contents: read
    pull-requests: read

concurrency:
    group: scope-tours-docs-refresh-${{ github.event.pull_request.number || 'main' }}
    cancel-in-progress: false

env:
    BRANCH: learn/docs-refresh
    # The Learn owner, who gets the pull request assigned.
    OWNER: jelstongreen

jobs:
    guard:
        name: Is a refresh pull request already open?
        if: github.repository == 'lightdash/lightdash' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            number: ${{ steps.open.outputs.number }}
        steps:
            - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
              with:
                  egress-policy: audit
            - name: Look for an open refresh pull request
              id: open
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  number=''
                  # A pull request run is a dry run, so it never waits on this.
                  if [ "$GITHUB_EVENT_NAME" != 'pull_request' ]; then
                      number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open \
                          --json number,isCrossRepository \
                          --jq '[.[] | select(.isCrossRepository | not)][0].number // empty')
                  fi
                  echo "number=$number" >> "$GITHUB_OUTPUT"
                  if [ -n "$number" ]; then
                      echo "Refresh pull request #$number is open, so this run did nothing. Merge or close it first." >> "$GITHUB_STEP_SUMMARY"
                  fi

    refresh:
        name: Refresh the walkthroughs from the latest docs
        needs: guard
        if: needs.guard.outputs.number == ''
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
              with:
                  egress-policy: audit
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
            - uses: ./.github/workflows/_setup_node_pnpm
            # After the setup action: it cleans the workspace, which would remove
            # a docs checkout made before it. The bump compares the pin with the
            # docs history, so the history is fetched in full (without the file
            # contents of old commits).
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
              with:
                  repository: lightdash/mintlify-docs
                  path: mintlify-docs
                  fetch-depth: 0
                  filter: blob:none
                  persist-credentials: false
            - name: Build common
              run: pnpm common-build
            - name: Bump the pin to the latest docs
              id: bump
              env:
                  LIGHTDASH_DOCS_DIR: ${{ github.workspace }}/mintlify-docs
              run: |
                  generated='packages/frontend/src/features/scopeTours/generated.ts packages/frontend/src/features/scopeTours/released.ts packages/frontend/src/features/scopeTours/curriculum.ts'
                  old=$(cat scripts/scope-tours/docs-pin.txt)
                  status=0
                  pnpm scope-tours:bump-docs > "$RUNNER_TEMP/bump.log" 2>&1 || status=$?
                  cat "$RUNNER_TEMP/bump.log"
                  new=$(cat scripts/scope-tours/docs-pin.txt)
                  if [ "$status" -ne 0 ] && [ "$new" = "$old" ]; then
                      echo "::error title=The bump failed before it moved the pin::Nothing was opened. The log above has the reason."
                      exit 1
                  fi
                  # shellcheck disable=SC2086
                  if [ "$status" -eq 0 ] && git diff --quiet -- $generated; then
                      echo "open=false" >> "$GITHUB_OUTPUT"
                      echo "The walkthroughs are unchanged at docs \`${new:0:8}\`, so there is nothing to refresh. The pin stays at \`${old:0:8}\`." >> "$GITHUB_STEP_SUMMARY"
                      exit 0
                  fi
                  passed=false
                  if [ "$status" -eq 0 ]; then passed=true; fi
                  {
                      echo "open=true"
                      echo "passed=$passed"
                      echo "old=$old"
                      echo "new=$new"
                  } >> "$GITHUB_OUTPUT"
            - name: Write the pull request body
              if: steps.bump.outputs.open == 'true'
              env:
                  OLD: ${{ steps.bump.outputs.old }}
                  NEW: ${{ steps.bump.outputs.new }}
                  PASSED: ${{ steps.bump.outputs.passed }}
              run: |
                  docs=https://github.com/lightdash/mintlify-docs
                  guide="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/main/docs/learn/maintaining-walkthroughs.md"
                  {
                      echo "Moves the docs pin from [\`${OLD:0:8}\`]($docs/commit/$OLD) to [\`${NEW:0:8}\`]($docs/commit/$NEW) and regenerates the Learn walkthroughs from it. [Docs changes in this range]($docs/compare/$OLD...$NEW)."
                      echo
                      if [ "$PASSED" = 'true' ]; then
                          echo '### Changed steps'
                          echo
                          # The table rows are docs sentences. An @name in one is
                          # written as an entity, so it notifies nobody.
                          if grep -q '^| ' "$RUNNER_TEMP/bump.log"; then
                              grep '^| ' "$RUNNER_TEMP/bump.log" | sed 's/@/\&#64;/g'
                          else
                              echo 'No step title or body changed. The diff shows what moved in the teaching order.'
                          fi
                      else
                          echo '> [!WARNING]'
                          echo '> The bump stopped before it finished, so this pull request holds only what it had written by then. The errors below say why.'
                          echo
                          echo '```'
                          # The error lines if the log has any, else its tail.
                          # shellcheck disable=SC2016
                          if grep -E '^Error: |: error: | error\(s\), ' "$RUNNER_TEMP/bump.log" > "$RUNNER_TEMP/bump-errors.log"; then
                              head -n 30 "$RUNNER_TEMP/bump-errors.log"
                          else
                              tail -n 40 "$RUNNER_TEMP/bump.log"
                          fi | sed -e $'s/\x1b\\[[0-9;]*m//g' -e 's/```/` ` `/g'
                          echo '```'
                          echo
                          echo "[Full log]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
                      fi
                      # One line per citation the bump moved, as it printed them.
                      if grep -q '^moved citation: ' "$RUNNER_TEMP/bump.log"; then
                          echo
                          echo '### Moved citations'
                          echo
                          echo 'The docs moved these cited texts without changing them, so the bump moved the citations to match. Learners see the same words.'
                          echo
                          grep '^moved citation: ' "$RUNNER_TEMP/bump.log" | sed -e 's/^moved citation: /- /' -e 's/@/\&#64;/g'
                      fi
                      echo
                      echo '### Review'
                      echo
                      echo '- [ ] Each changed card still matches its step title.'
                      echo
                      echo "The bump follows a cited text that only moved inside its section. A body that now says something unrelated, or a bump that stopped, means the docs edited the text as well as moving it, or renamed its heading. Fix the \`data-tour-docs\` attribute on this branch, regenerate with the docs at the new pin, and push here. [maintaining-walkthroughs.md]($guide) names each failure and its fix."
                      echo
                      # shellcheck disable=SC2016
                      echo 'Opened by `.github/workflows/scope-tours-docs-refresh.yml`. While this pull request is open the job does not run the bump again.'
                      echo
                      # Read by pr.yml (see the note at the top of this file).
                      # shellcheck disable=SC2016
                      echo '`deploy-preview`: leave this word in. CI skips the preview and the E2E suites for a pull request the Renovate app opened, and this word asks for them.'
                  } > "$RUNNER_TEMP/body.md"
                  cat "$RUNNER_TEMP/body.md" >> "$GITHUB_STEP_SUMMARY"
            # The commit is made through the API, not pushed with git, so GitHub
            # signs it for the app. main takes signed commits only, and a pull
            # request that holds an unsigned commit cannot merge. This step
            # writes the request and sends nothing, so a dry run checks it too.
            - name: Build the commit
              if: steps.bump.outputs.open == 'true'
              env:
                  NEW: ${{ steps.bump.outputs.new }}
              run: |
                  # What the bump changed: the pin, the generated files, and the
                  # frontend source files whose citation it moved.
                  git diff --name-only -- scripts/scope-tours/docs-pin.txt packages/frontend/src > "$RUNNER_TEMP/changed.txt"
                  echo '[]' > "$RUNNER_TEMP/additions.json"
                  while IFS= read -r file; do
                      # The API takes base64 with no line breaks in it.
                      base64 < "$file" | tr -d '\n' > "$RUNNER_TEMP/contents.b64"
                      jq --arg path "$file" --rawfile contents "$RUNNER_TEMP/contents.b64" \
                          '. + [{path: $path, contents: $contents}]' \
                          "$RUNNER_TEMP/additions.json" > "$RUNNER_TEMP/additions.next.json"
                      mv "$RUNNER_TEMP/additions.next.json" "$RUNNER_TEMP/additions.json"
                  done < "$RUNNER_TEMP/changed.txt"
                  jq -n \
                      --arg repository "$GITHUB_REPOSITORY" \
                      --arg branch "$BRANCH" \
                      --arg head "$GITHUB_SHA" \
                      --arg headline "chore(learn): refresh walkthroughs from docs ${NEW:0:8}" \
                      --slurpfile additions "$RUNNER_TEMP/additions.json" \
                      '{
                          query: "mutation ($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
                          variables: {
                              input: {
                                  branch: { repositoryNameWithOwner: $repository, branchName: $branch },
                                  expectedHeadOid: $head,
                                  message: { headline: $headline },
                                  fileChanges: { additions: $additions[0] }
                              }
                          }
                      }' > "$RUNNER_TEMP/commit.json"
                  jq -r '.variables.input | "The commit \"\(.message.headline)\" on \(.branch.branchName) holds: \([.fileChanges.additions[].path] | join(", "))"' "$RUNNER_TEMP/commit.json"
            # From here on: the schedule or a manual run only, never a pull
            # request. The Renovate app already pushes branches and opens pull
            # requests in this repository; the token is narrowed to those two
            # permissions. Only the last step holds it, and uses it through the
            # API: no checkout is made with it.
            - name: Create a token that can open the pull request
              id: app-token
              if: steps.bump.outputs.open == 'true' && github.event_name != 'pull_request'
              uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
              with:
                  app-id: 3732288
                  private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
                  permission-contents: write
                  permission-pull-requests: write
            - name: Open the refresh pull request
              if: steps.bump.outputs.open == 'true' && github.event_name != 'pull_request'
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
              run: |
                  # The branch starts at the commit the bump ran on. The guard job
                  # found no open refresh pull request, so a branch left behind by
                  # a closed one is safe to move.
                  if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --silent 2> /dev/null; then
                      gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" -f "sha=$GITHUB_SHA" -F force=true --silent
                  else
                      gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/heads/$BRANCH" -f "sha=$GITHUB_SHA" --silent
                  fi
                  gh api graphql --input "$RUNNER_TEMP/commit.json" --jq '"Committed " + .data.createCommitOnBranch.commit.oid'
                  url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
                      --title 'chore(learn): refresh walkthroughs from the docs' \
                      --body-file "$RUNNER_TEMP/body.md")
                  echo "Opened $url" >> "$GITHUB_STEP_SUMMARY"
                  gh pr edit "$url" --add-assignee "$OWNER" || echo "::warning::Could not assign $url to $OWNER"
