name: Static asset uploader checks

on:
  pull_request:
    paths:
      - 'docker/static-assets.Dockerfile'
      - '.github/scripts/test-static-assets-export.sh'
      - '.github/scripts/upload-static-assets.mts'
      - '.github/scripts/upload-static-assets.test.mts'
      - '.github/workflows/static-assets-checks.yml'
      - '.github/workflows/post-release.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: node --test .github/scripts/upload-static-assets.test.mts
      - run: bash .github/scripts/test-static-assets-export.sh

  verify-depot-export:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/prod-8618-assets-artifact'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS_IMAGE_DEPLOY }}'
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - uses: depot/setup-action@15c09a5f77a0840ad4bce955686522a257853461
      - name: Authenticate and sample disk space
        run: |
          gcloud auth configure-docker us-docker.pkg.dev --quiet
          docker image ls --quiet > /tmp/initial-docker-images
          nohup bash -c 'while true; do df -B1 --output=avail . | tail -1 | tr -d " " >> /tmp/assets-disk-samples; sleep 1; done' >/tmp/assets-disk-monitor.log 2>&1 &
      - name: Export the existing release using the draft workflow path
        uses: depot/build-push-action@5f3b3c2e5a00f0093de47f657aeaefcedff27d18
        with:
          project: bgbbt3d0kc
          token: ${{ secrets.DEPOT_PROJECT_TOKEN }}
          context: ./docker
          file: docker/static-assets.Dockerfile
          platforms: linux/amd64
          build-args: |
            RELEASE_IMAGE=us-docker.pkg.dev/lightdash-containers/lightdash/lightdash@sha256:9182cda5ef892d4247f08c8c05fd06ebec63c52da64d035121e8a933168491fa
          outputs: type=local,dest=retained-static-assets
      - name: Verify release bytes and isolated staging publication
        run: |
          du -sh retained-static-assets
          node .github/scripts/verify-static-assets-export.mts
      - name: Report disk space
        if: always()
        run: |
          df -h .
          if test -f /tmp/assets-disk-samples; then head -1 /tmp/assets-disk-samples; sort -n /tmp/assets-disk-samples | head -1; fi
