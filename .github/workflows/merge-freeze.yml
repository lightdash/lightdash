name: Merge freeze

# Holds `main` while a release is cut. `release.yml` fires on every push to
# `main`, so the release that goes out is whatever `main` happens to contain at
# that moment: a merge landing in the gap between "merge the fix someone is
# waiting on" and "the release job picks it up" either delays that release or
# widens it past the change we meant to ship. Until now the only lever was
# asking people in Slack not to merge.
#
# Freezing adds a `merge-freeze` context to the `main` ruleset's required status
# checks; unfreezing takes it off again. Nothing ever reports that context, so
# while it is required the merge button is blocked for everyone without a
# ruleset bypass. Enforcement is that rule alone - the commit statuses this
# posts on open PRs only replace GitHub's opaque "Expected - Waiting for status
# to be reported" with the name of whoever froze it. That split is the
# fail-safe one: if the status half breaks, merges stay blocked while frozen
# and unblock the moment the rule comes off.
#
# The ruleset and variables APIs need Administration: write, which GITHUB_TOKEN
# cannot be granted (`administration` is not a workflow permission scope), so
# this runs on a PAT/App token - see the preflight step. workflow_dispatch
# already requires write access, so whoever can run this can already merge.
#
# SPK-985.

on:
  workflow_dispatch:
    inputs:
      action:
        description: Freeze or unfreeze merges to main
        required: true
        type: choice
        options:
          - freeze
          - unfreeze
      slack_actor:
        description: Authenticated Slack identity supplied by the configured dispatcher
        required: false
        type: string

permissions: {}

# Two toggles at once would read-modify-write the same ruleset, and the loser of
# the race would PUT back a rules array built from a stale read.
concurrency:
  group: merge-freeze-${{ github.repository }}
  cancel-in-progress: false
  queue: max

env:
  FREEZE_CONTEXT: merge-freeze

jobs:
  toggle:
    name: ${{ inputs.action }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Preflight - token can administer rulesets
        env:
          GH_TOKEN: ${{ secrets.MERGE_FREEZE_TOKEN || secrets.CI_GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::No token available. Add a MERGE_FREEZE_TOKEN secret - a fine-grained PAT or App installation token on $REPO with Administration: write (rulesets), Variables: write and Commit statuses: write."
            exit 1
          fi

          # Listing rulesets is itself an Administration-scoped read, so this
          # doubles as the permission check. Failing here costs seconds; failing
          # after a half-applied freeze costs a confusing repo.
          if ! gh api "repos/$REPO/rulesets" >/dev/null 2>&1; then
            echo "::error::The configured token cannot read repository rulesets on $REPO. It needs Administration: write (fine-grained) or repo admin (classic). GITHUB_TOKEN can never do this - 'administration' is not a grantable workflow permission scope."
            exit 1
          fi

      - name: ${{ inputs.action }} merges to main
        id: toggle
        env:
          GH_TOKEN: ${{ secrets.MERGE_FREEZE_TOKEN || secrets.CI_GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ACTION: ${{ inputs.action }}
          ACTOR_LOGIN: ${{ github.actor }}
          SLACK_ACTOR: ${{ inputs.slack_actor }}
          CONTEXT: ${{ env.FREEZE_CONTEXT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ "$ACTION" != "freeze" ] && [ "$ACTION" != "unfreeze" ]; then
            echo "::error::Invalid merge freeze action."
            exit 1
          fi

          read_variables() {
            gh api --paginate --slurp "repos/$REPO/actions/variables" | jq -e '
              if type == "array" and length > 0
                 and all(.[]; (.variables | type) == "array") then
                [.[].variables[]]
                | if all(.[]; (.name | type) == "string" and (.value | type) == "string")
                  then . else error("Invalid repository variables") end
                | if all(.[] | select(.name == "MERGE_FREEZE_ACTOR" or .name == "MERGE_FREEZE_SLACK_DISPATCHER");
                    .value | explode | all(. >= 32 and . <= 126))
                  then . else error("Invalid ownership variable") end
              else error("Invalid repository variables response") end
            '
          }

          variables=$(read_variables)
          FREEZE_ACTOR=$(jq -r '[.[] | select(.name == "MERGE_FREEZE_ACTOR") | .value]
            | if length <= 1 then .[0] // "" else error("Duplicate freeze owner") end' <<<"$variables")
          dispatcher=$(jq -r '[.[] | select(.name == "MERGE_FREEZE_SLACK_DISPATCHER") | .value]
            | if length <= 1 then .[0] // "" else error("Duplicate dispatcher") end' <<<"$variables")
          actor_key=$(printf '%s' "$ACTOR_LOGIN" | tr '[:upper:]' '[:lower:]')
          dispatcher_key=$(printf '%s' "$dispatcher" | tr '[:upper:]' '[:lower:]')
          effective_actor=$ACTOR_LOGIN

          if [ -n "${SLACK_ACTOR:-}" ]; then
            if [ -z "$dispatcher" ] || [ "$actor_key" != "$dispatcher_key" ]; then
              echo "::error::Slack identity requires the configured MERGE_FREEZE_SLACK_DISPATCHER."
              exit 1
            fi
            if [[ ! "$SLACK_ACTOR" =~ ^T0163M87MB9:U[A-Z0-9]{8,31}$ ]]; then
              echo "::error::Invalid Slack identity."
              exit 1
            fi
            effective_actor=$SLACK_ACTOR
          elif [ -n "$dispatcher" ] && [ "$actor_key" = "$dispatcher_key" ]; then
            echo "::error::The Slack dispatcher must supply an authenticated Slack identity."
            exit 1
          fi

          configured_ruleset_id=$(jq -r '
            [.[] | select(.name == "MERGE_FREEZE_RULESET_ID") | .value]
            | if length == 0 then ""
              elif length == 1 and (.[0] | test("^[1-9][0-9]*$"))
                   and (.[0] | explode | all(. >= 48 and . <= 57)) then .[0]
              else error("MERGE_FREEZE_RULESET_ID must be a positive numeric ruleset ID") end
          ' <<<"$variables")
          default_branch=$(gh api "repos/$REPO" --jq .default_branch)
          candidates=$(gh api --paginate "repos/$REPO/rulesets" \
            --jq '.[] | select(.target == "branch" and .enforcement == "active") | .id')

          matching=()
          frozen_rulesets='[]'
          matching_rulesets='[]'
          for id in $candidates; do
            candidate=$(gh api "repos/$REPO/rulesets/$id")
            candidate_source=$(jq -r '
              if .target == "branch" and .enforcement == "active" then .source_type else "" end
            ' <<<"$candidate")
            [ -n "$candidate_source" ] || continue
            covers=$(jq --arg branch "refs/heads/$default_branch" --arg ctx "$CONTEXT" '
              def default_ref: . == "~ALL" or . == "~DEFAULT_BRANCH" or . == $branch;
              def literal_ref: startswith("refs/heads/") and
                (explode | all(. != 42 and . != 63 and . != 91 and . != 93 and . != 92));
              (.conditions.ref_name.include // []) as $include
              | (.conditions.ref_name.exclude // []) as $exclude
              | if any($exclude[]; default_ref) then false
                elif any($include[]; default_ref) then
                  if all($exclude[]; literal_ref) then true
                  else error("Cannot safely evaluate ruleset exclusions; ask a repository admin") end
                elif any($include[]; literal_ref | not) and
                     any(.rules[]? | select(.type == "required_status_checks")
                         | .parameters.required_status_checks[]?; .context == $ctx) then
                  error("Cannot rule out another freeze on the default branch; ask a repository admin")
                else false end
            ' <<<"$candidate")
            if [ "$covers" = "true" ]; then
              if jq -e --arg ctx "$CONTEXT" '
                any(.rules[]? | select(.type == "required_status_checks")
                    | .parameters.required_status_checks[]?; .context == $ctx)
              ' <<<"$candidate" >/dev/null; then
                frozen_rulesets=$(jq --arg id "$id" '. + [$id]' <<<"$frozen_rulesets")
              fi
              if [ "$candidate_source" = "Repository" ]; then
                matching+=("$id")
                matching_rulesets=$(jq --arg id "$id" --argjson ruleset "$candidate" \
                  '. + [{id: $id, ruleset: $ruleset}]' <<<"$matching_rulesets")
              fi
            fi
          done

          if [ -n "$configured_ruleset_id" ]; then
            ruleset_id=$configured_ruleset_id
            ruleset=$(jq -e --arg id "$ruleset_id" '
              [.[] | select(.id == $id)]
              | if length == 1 then .[0].ruleset
                else error("Configured ruleset is not an active repository branch ruleset covering the default branch") end
            ' <<<"$matching_rulesets")
          else
            if [ "${#matching[@]}" -eq 0 ]; then
              echo "::error::No active repository branch ruleset covers $default_branch on $REPO, so there is nothing to attach the $CONTEXT check to."
              exit 1
            fi
            if [ "${#matching[@]}" -gt 1 ]; then
              echo "::error::${#matching[@]} active rulesets cover $default_branch (ids: ${matching[*]}). Set the MERGE_FREEZE_RULESET_ID repository variable to select the merge protection ruleset."
              exit 1
            fi
            ruleset_id=${matching[0]}
            ruleset=$(jq '.[0].ruleset' <<<"$matching_rulesets")
          fi

          if ! jq -e --arg id "$ruleset_id" 'all(.[]; . == $id)' <<<"$frozen_rulesets" >/dev/null; then
            echo "::error::Another applicable ruleset contains '$CONTEXT'. Ask a repository admin to review the freeze before retrying."
            exit 1
          fi

          ruleset_name=$(jq -r .name <<<"$ruleset")
          echo "Editing ruleset $ruleset_name (id $ruleset_id) on $default_branch"

          was_required=$(jq --arg ctx "$CONTEXT" '
            [.rules[]? | select(.type == "required_status_checks")
                       | .parameters.required_status_checks[]?
                       | select(.context == $ctx)] | length > 0
          ' <<<"$ruleset")

          if [ "$was_required" = "true" ] && [ -n "$FREEZE_ACTOR" ]; then
            if [[ ! "$FREEZE_ACTOR" =~ ^T0163M87MB9:U[A-Z0-9]{8,31}$ ]] \
               && [[ ! "$FREEZE_ACTOR" =~ ^[a-zA-Z0-9][a-zA-Z0-9-]{0,38}(\[bot\])?$ ]]; then
              echo "::error::Invalid recorded freeze owner. Ask a repository admin to recover the freeze."
              exit 1
            fi
          fi

          if [ "$ACTION" = "unfreeze" ] && [ "$was_required" = "true" ] && [ -z "${SLACK_ACTOR:-}" ]; then
            owner_key=$FREEZE_ACTOR
            effective_key=$effective_actor
            if [[ "$FREEZE_ACTOR" != *:* ]]; then
              owner_key=$(printf '%s' "$FREEZE_ACTOR" | tr '[:upper:]' '[:lower:]')
              effective_key=$actor_key
            fi
            if [ -n "$FREEZE_ACTOR" ] && [ "$owner_key" != "$effective_key" ]; then
              echo "::error::Only the recorded freeze owner can unfreeze main. Ask the owner or a repository admin."
              exit 1
            fi
          fi

          display_owner=$effective_actor
          if [ "$ACTION" = "freeze" ]; then
            if [ "$was_required" = "true" ]; then
              display_owner=${FREEZE_ACTOR:-an unknown owner}
            else
              gh variable set MERGE_FREEZE_ACTOR --repo "$REPO" --body "$effective_actor"
              recorded_variables=$(read_variables)
              jq -e --arg owner "$effective_actor" '
                [.[] | select(.name == "MERGE_FREEZE_ACTOR") | .value] == [$owner]
              ' <<<"$recorded_variables" >/dev/null
            fi
          fi

          if [ "$ACTION" = "freeze" ]; then
            new_rules=$(jq --arg ctx "$CONTEXT" '
              (.rules // []) as $rules
              | if any($rules[]; .type == "required_status_checks") then
                  [$rules[] | if .type == "required_status_checks" and
                       (any(.parameters.required_status_checks[]?; .context == $ctx) | not)
                     then .parameters.required_status_checks += [{context: $ctx}]
                     else . end]
                else
                  $rules + [{
                    type: "required_status_checks",
                    parameters: {
                      strict_required_status_checks_policy: false,
                      do_not_enforce_on_create: false,
                      required_status_checks: [{context: $ctx}]
                    }
                  }]
                end
            ' <<<"$ruleset")
          else
            new_rules=$(jq --arg ctx "$CONTEXT" '
              [(.rules // [])[]
               | if .type == "required_status_checks"
                 then .parameters.required_status_checks |=
                        [.[] | select(.context != $ctx)]
                 else . end]
              | [.[] | select(.type != "required_status_checks"
                              or (.parameters.required_status_checks | length) > 0)]
            ' <<<"$ruleset")
          fi

          # PUT the whole object rather than a rules-only patch: bypass_actors is
          # what lets the release bot push to main, and it is not worth finding
          # out the hard way whether an omitted field is preserved or cleared.
          payload=$(jq -n --argjson r "$ruleset" --argjson rules "$new_rules" '{
            name: $r.name,
            target: $r.target,
            enforcement: $r.enforcement,
            conditions: $r.conditions,
            bypass_actors: [$r.bypass_actors[]? | {actor_id, actor_type, bypass_mode}],
            rules: $rules
          }')
          if { [ "$ACTION" = "freeze" ] && [ "$was_required" = "false" ]; } \
             || { [ "$ACTION" = "unfreeze" ] && [ "$was_required" = "true" ]; }; then
            gh api --method PUT "repos/$REPO/rulesets/$ruleset_id" --input - <<<"$payload" >/dev/null
          fi

          # Read back rather than trust the write: a silently no-op'd PUT would
          # leave everyone believing main is frozen when it is not.
          now_required=$(gh api "repos/$REPO/rulesets/$ruleset_id" \
            | jq --arg ctx "$CONTEXT" '
                [.rules[]? | select(.type == "required_status_checks")
                           | .parameters.required_status_checks[]?
                           | select(.context == $ctx)] | length > 0
              ')

          if [ "$ACTION" = "freeze" ] && [ "$now_required" != "true" ]; then
            echo "::error::Wrote the ruleset but '$CONTEXT' is still not required - main is NOT frozen."
            exit 1
          fi
          if [ "$ACTION" = "unfreeze" ] && [ "$now_required" != "false" ]; then
            echo "::error::Wrote the ruleset but '$CONTEXT' is still required - main is still frozen."
            exit 1
          fi

          # This repo is public, so commit statuses are world-readable. There is
          # no free-text reason anywhere in this workflow by design: "we are
          # holding main for an escalation" is exactly the sort of sentence
          # that names a customer, and a text box invites someone to write it.
          #
          # Naming the person instead carries nothing sensitive and gives
          # whoever is blocked something to act on - go and ask them - rather
          # than hunting the Actions tab to work out who to ask.
          if [ "$ACTION" = "freeze" ]; then
            state=failure
            description="Merges to main are frozen by $display_owner - ask Cloudy in Slack"
          else
            state=success
            description="Merges to main are open"
          fi

          # `changed` is false when this run was a no-op (freezing an already
          # frozen main, or unfreezing an open one). The announce step reads it
          # so a second freeze does not post a second [merge-freeze-on].
          if [ "$ACTION" = "freeze" ] && [ "$was_required" = "true" ]; then
            changed=false
          elif [ "$ACTION" = "unfreeze" ] && [ "$was_required" = "false" ]; then
            changed=false
          else
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

          # Mirrored into a repo variable so merge-freeze-status.yml can label
          # PRs opened mid-freeze without an admin token of its own. It carries
          # the state only, never the reason: that workflow's log is public.
          # Non-fatal - the ruleset is what blocks merges, so a stale variable
          # degrades the message, never the enforcement.
          if [ "$ACTION" = "freeze" ]; then freeze_var=true; else freeze_var=false; fi
          gh variable set MERGE_FREEZE --repo "$REPO" --body "$freeze_var" \
            || echo "::warning::Could not write the MERGE_FREEZE variable. The freeze is applied, but PRs opened during it will show an unexplained blocked check."

          if [ "$ACTION" = "unfreeze" ]; then
            gh variable delete MERGE_FREEZE_ACTOR --repo "$REPO" 2>/dev/null \
              || echo "::warning::Could not clear the recorded freeze owner. The ruleset is open."
          fi
          echo "actor=$effective_actor" >> "$GITHUB_OUTPUT"

          # Only PRs targeting the default branch: the ruleset covers main
          # alone, so a stacked PR merging into its parent is not blocked and
          # must not be told it is. Assigned before the loop so a failure to
          # list is fatal here, rather than a process substitution silently
          # yielding zero PRs to update.
          open_prs=$(gh api --paginate --slurp "repos/$REPO/pulls?state=open&per_page=100" \
            | jq -sr --arg branch "$default_branch" '
                if length == 1 then .[0] else error("Missing pull request pages") end
                | if type == "array" and length > 0 and all(.[]; type == "array")
                then .[][] else error("Invalid pull request pages") end
                | select(.base.ref == $branch) | "\(.number)\t\(.head.sha)"')

          # Best-effort by design: the freeze is already in force by this point,
          # and one unpostable status must not fail the run. Fork PRs are
          # expected to fail here - their head commits live in another repo - and
          # stay blocked by the missing required status, which is still the
          # correct outcome, just a quieter one.
          posted=0
          unreachable=0
          if [ -n "$open_prs" ]; then
            while IFS=$'\t' read -r number sha; do
              [ -n "$sha" ] || continue
              if gh api --method POST "repos/$REPO/statuses/$sha" \
                   -f state="$state" \
                   -f context="$CONTEXT" \
                   -f description="$description" \
                   -f target_url="$RUN_URL" >/dev/null 2>&1; then
                posted=$((posted + 1))
              else
                unreachable=$((unreachable + 1))
                echo "Could not post status to PR #$number ($sha)"
              fi
            done <<<"$open_prs"
          fi

          {
            if [ "$ACTION" = "freeze" ]; then
              echo "## Merges to main are frozen"
            else
              echo "## Merges to main are open"
            fi
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Actor | $effective_actor |"
            echo "| Freeze owner | $display_owner |"
            echo "| Ruleset | \`$ruleset_name\` (id $ruleset_id) |"
            echo "| Required check | \`$CONTEXT\` |"
            echo "| Open PRs updated | $posted (couldn't reach $unreachable) |"
            echo
            if [ "$ACTION" = "freeze" ]; then
              if [ "$was_required" = "true" ]; then
                echo "> Main was **already frozen** - this run only refreshed the PR statuses."
                echo
              fi
              echo "Any Lightdash employee can ask Cloudy in Slack to unfreeze merges to \`${REPO##*/}\`."
              echo
              if [ "$display_owner" = "an unknown owner" ]; then
                echo "No owner is recorded. A direct GitHub dispatch or repository admin can also recover the freeze."
              else
                echo "Direct GitHub dispatch remains available to the recorded owner. A repo admin can remove the \`$CONTEXT\` check from the \`$ruleset_name\` ruleset by hand."
              fi
            else
              if [ "$was_required" = "false" ]; then
                echo "> Main was **not frozen** - this run only cleared any stale \`$CONTEXT\` statuses."
                echo
              fi
              echo "Merges are open. If a PR still shows a stale \`$CONTEXT\` failure, ask Cloudy to unfreeze merges to \`${REPO##*/}\` again, then check the linked run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # A freeze that nobody is told about is the manual coordination this
      # workflow exists to remove: the first anyone knows is a dead merge
      # button. Posts on both directions, and only when the state actually
      # changed, so a repeat freeze does not announce twice.
      #
      # SLACK_WEBHOOK_URL is the repo's existing incoming webhook, targeted at
      # #engineering by the channel override in the payload - the same shape
      # ai-agent-integration-tests.yml uses to reach #ai-agent-tests-feed.
      #
      # SPK-986.
      - name: Announce in #engineering
        if: steps.toggle.outputs.changed == 'true'
        env:
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          ACTION: ${{ inputs.action }}
          ACTOR_LOGIN: ${{ steps.toggle.outputs.actor }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/merge-freeze.yml
        run: |
          set -euo pipefail

          if [ -z "${WEBHOOK:-}" ]; then
            echo "::warning::SLACK_WEBHOOK_URL is not set, so nothing was announced. The freeze itself is unaffected."
            exit 0
          fi

          # No reason is carried anywhere, by design: this repo is public and a
          # free-text box invites someone to name a customer in it. Whoever
          # froze main can say why in the thread if it matters.
          if [[ "$ACTOR_LOGIN" == T0163M87MB9:U* ]]; then
            actor_mention="<@${ACTOR_LOGIN#*:}>"
          else
            actor_mention="@$ACTOR_LOGIN"
          fi

          if [ "$ACTION" = "freeze" ]; then
            text=":lock: *[merge-freeze-on]* Merges to \`main\` are frozen by ${actor_mention}."
            text="$text"$'\n'"Your PRs will show a red \`merge-freeze\` check until it lifts. Any Lightdash employee can ask Cloudy to unfreeze merges to \`${REPO##*/}\`. A repo admin can also remove the check from the main ruleset by hand."
          else
            text=":unlock: *[merge-freeze-off]* Merges to \`main\` are open again, lifted by ${actor_mention}."
            text="$text"$'\n'"If your PR still shows a stale \`merge-freeze\` failure, ask Cloudy to unfreeze merges to \`${REPO##*/}\` again, then check the linked run."
          fi
          text="$text"$'\n'"<${RUN_URL}|View run>"

          payload=$(jq -n --arg text "$text" '{channel: "#engineering", username: "Merge freeze", text: $text}')

          # Never fail the run on a Slack problem: the freeze is already applied
          # by this point, and a failed job here would read as "the freeze did
          # not take" to whoever dispatched it.
          if ! curl --connect-timeout 10 --max-time 30 --fail --silent --show-error \
                 --request POST \
                 --header 'Content-Type: application/json' \
                 --data "$payload" \
                 "$WEBHOOK" >/dev/null; then
            echo "::warning::Could not post the announcement to #engineering. Merges are still $([ "$ACTION" = freeze ] && echo frozen || echo open) - tell the team by hand."
          fi
