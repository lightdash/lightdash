name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  deployments: write
  contents: read
  pull-requests: write
  issues: write
  packages: write

jobs:
  # ============================================================================
  # Stage 0: Fast checks (no install needed)
  # ============================================================================
  check-exact-deps:
    name: Enforce Exact Dependency Versions
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Check for range specifiers in package.json files
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');

          const files = require('child_process')
            .execSync('find . -name package.json -not -path \"*/node_modules/*\"', { encoding: 'utf8' })
            .trim().split('\n');

          const workspaceFile = 'pnpm-workspace.yaml';
          const workspaceContent = fs.existsSync(workspaceFile) ? fs.readFileSync(workspaceFile, 'utf8') : '';
          const workspaceLines = workspaceContent.split('\n');
          const workspaceIssues = [];
          let inOverrides = false;

          const issues = [];
          for (const f of files) {
            const pkg = JSON.parse(fs.readFileSync(f, 'utf8'));
            for (const section of ['dependencies', 'devDependencies', 'optionalDependencies']) {
              if (!pkg[section]) continue;
              for (const [name, ver] of Object.entries(pkg[section])) {
                if (ver.startsWith('workspace:')) continue;
                if (/^[\^~><=]/.test(ver) || ver.includes('||')) {
                  issues.push(f + ' [' + section + '] ' + name + ': ' + ver);
                }
              }
            }
            if (pkg.pnpm && pkg.pnpm.overrides) {
              for (const [key, ver] of Object.entries(pkg.pnpm.overrides)) {
                if (/^[\^~><=]/.test(ver) || ver.includes('||')) {
                  issues.push(f + ' [pnpm.overrides] ' + key + ': ' + ver);
                }
              }
            }
          }
          if (workspaceContent) {
            for (const line of workspaceLines) {
              if (!inOverrides && /^overrides:\s*$/.test(line)) {
                inOverrides = true;
                continue;
              }
              if (inOverrides) {
                if (/^\S/.test(line)) {
                  break;
                }
                if (/^\\s*#/.test(line)) {
                  continue;
                }

                const match = line.match(/^\\s{2}(?:'([^']+)'|\"([^\"]+)\"|([^:\\s]+))\\s*:\\s*(?:'([^']*)'|\"([^\"]*)\"|([^#]+?))\\s*(?:#.*)?$/);
                if (!match) {
                  continue;
                }

                const key = match[1] || match[2] || match[3];
                const ver = (match[4] || match[5] || match[6]).trim();
                if (/^[\^~><=]/.test(ver) || /\\|\\|/.test(ver)) {
                  workspaceIssues.push('pnpm-workspace.yaml [pnpm-workspace overrides] ' + key + ': ' + ver);
                }
              }
            }
          }
          issues.push(...workspaceIssues);

          if (issues.length > 0) {
            console.error('ERROR: Found range specifiers in dependencies. All deps must use exact versions.');
            console.error('See: https://github.com/lightdash/lightdash/pull/21553');
            console.error('');
            issues.forEach(i => console.error('  ' + i));
            console.error('');
            console.error('Fix: use exact versions (e.g. \"1.2.3\" not \"^1.2.3\"). The .npmrc save-exact=true');
            console.error('covers the npm CLI, and savePrefix set to empty string in pnpm-workspace.yaml covers pnpm.');
            process.exit(1);
          }

          console.log('All ' + files.length + ' package.json files use exact dependency versions.');
          "

  # ============================================================================
  # Stage 1: Build, lint, typecheck, and test
  # ============================================================================
  build-and-lint:
    name: Build & Lint
    runs-on: depot-ubuntu-24.04-8
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_API: https://cache.depot.dev
      NODE_OPTIONS: "--max-old-space-size=8192"
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          cache: true
          install: false

      - name: Install packages
        run: pnpm install --frozen-lockfile --prefer-offline --network-concurrency=16
      - name: Build
        run: pnpm build
      - name: Run quality checks in parallel
        run: |
          pnpm lint & pid_lint=$!
          pnpm format & pid_format=$!
          pnpm -F frontend unused-exports & pid_unused=$!
          pnpm typecheck & pid_typecheck=$!
          pnpm -F common check:filter-grammar-parser & pid_grammar=$!
          pnpm -F common check:filter-expression-parser & pid_expression_grammar=$!
          fail=0
          wait $pid_lint || fail=1
          wait $pid_format || fail=1
          wait $pid_unused || fail=1
          wait $pid_typecheck || fail=1
          wait $pid_grammar || fail=1
          wait $pid_expression_grammar || fail=1
          exit $fail

  # Unit tests run one package (or vitest shard) per runner instead of every
  # package contending for one 8-core box. Turbo still caches each task, so a
  # PR that does not touch a package replays its cached result. Vitest shard
  # args are part of the Turbo hash, so shards cache independently.
  unit-tests:
    name: "Unit Tests (${{ matrix.name }})"
    runs-on: depot-ubuntu-24.04-8
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_API: https://cache.depot.dev
      NODE_OPTIONS: "--max-old-space-size=8192"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend 1/2
            filter: --filter=backend
            args: -- --shard=1/2
          - name: backend 2/2
            filter: --filter=backend
            args: -- --shard=2/2
          - name: frontend 1/2
            filter: --filter=@lightdash/frontend
            args: -- --shard=1/2
          - name: frontend 2/2
            filter: --filter=@lightdash/frontend
            args: -- --shard=2/2
          - name: cli
            filter: --filter=@lightdash/cli
            args: ""
          - name: common, visualization, warehouses, e2e, api-tests, query-sdk
            filter: --filter=@lightdash/common --filter=@lightdash/visualization --filter=@lightdash/warehouses --filter=e2e --filter=api-tests --filter=@lightdash/query-sdk
            args: ""
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          cache: true
          install: false
      - name: Install packages
        run: pnpm install --frozen-lockfile --prefer-offline --network-concurrency=16
      - name: Run unit tests
        run: pnpm turbo run test ${{ matrix.filter }} ${{ matrix.args }}

  # Guards the published SDK bundle against re-introducing eval()/new Function()
  # that breaks consumers on a strict CSP (no 'unsafe-eval'). See issue #21276.
  # Runs in parallel so it doesn't extend the critical Build & Lint path.
  sdk-csp-check:
    name: SDK CSP Guard
    runs-on: depot-ubuntu-24.04-8
    env:
      NODE_OPTIONS: "--max-old-space-size=8192"
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          cache: true
          install: false

      - name: Install packages
        run: pnpm install --frozen-lockfile --prefer-offline --network-concurrency=16
      - name: Build SDK bundle
        run: pnpm sdk-build
      - name: Check SDK bundle is CSP-safe
        run: pnpm -F frontend check:sdk-csp

  # Draws every chart type through @lightdash/visualization in a real Chromium
  # and checks the DOM ECharts produces. Runs in parallel with Build & Lint.
  visualization-browser:
    name: Visualization in Chromium
    runs-on: depot-ubuntu-24.04-8
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          cache: true
          install: false

      - name: Install packages
        run: pnpm install --frozen-lockfile --prefer-offline --network-concurrency=16
      - name: Install Chromium
        run: pnpm -F visualization exec playwright install --with-deps chromium
      - name: Draw every chart type in Chromium
        run: pnpm -F visualization test:browser
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        if: failure()
        with:
          name: visualization-browser-results
          path: packages/visualization/browser/test-results
          retention-days: 7

  # Packs @lightdash/visualization and @lightdash/common as they would be
  # published, installs them outside the monorepo, and imports them from Node
  # ESM, Node CommonJS and TypeScript (node16 and bundler resolution).
  visualization-pack:
    name: Visualization package as published
    runs-on: depot-ubuntu-24.04-4
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          cache: true
          install: false

      - name: Install packages
        run: pnpm install --frozen-lockfile --prefer-offline --network-concurrency=16
      - name: Build common and visualization
        run: pnpm common-build && pnpm visualization-build
      - name: Pack, install and consume
        run: pnpm -F visualization test:pack

  # ============================================================================
  # Stage 2: Deploy preview environment (only if stage 1 passes)
  # ============================================================================
  files-changed:
    name: Select Tests to Run
    runs-on: depot-ubuntu-24.04-4
    outputs:
      # A Rainbow parity run (PR body contains `rainbow-parity`, same-repo PR) runs every suite.
      preview_backend: ${{ steps.backend.outputs.backend }}
      # Must equal the backend's SNOWFLAKE_AI_TEST_ACCOUNT_URL_ORIGIN; the backend dials it, not the runner.
      snowflake_ai_stub_url: ${{ steps.backend.outputs.backend == 'rainbow' && 'http://localhost:3900' || 'http://snowflake-ai-stub:3900' }}
      preview: ${{ steps.backend.outputs.backend == 'rainbow' || (steps.changes.outputs.preview == 'true' && github.event.pull_request.user.login != 'lightdash-renovate-bot[bot]' && !startsWith(github.event.pull_request.title, 'docs')) || contains(github.event.pull_request.body, 'deploy-preview') || contains(github.event.pull_request.body, 'test-all') }}
      frontend: ${{ steps.backend.outputs.backend == 'rainbow' || steps.changes.outputs.frontend == 'true' || contains(github.event.pull_request.body, 'test-frontend') || contains(github.event.pull_request.body, 'test-all') }}
      backend: ${{ steps.backend.outputs.backend == 'rainbow' || steps.changes.outputs.backend == 'true' || contains(github.event.pull_request.body, 'test-backend') || contains(github.event.pull_request.body, 'test-all') }}
      api_schema: ${{ steps.changes.outputs.api_schema == 'true' }}
      timezone: ${{ steps.backend.outputs.backend == 'rainbow' || steps.changes.outputs.timezone == 'true' || contains(github.event.pull_request.body, 'test-timezone') || contains(github.event.pull_request.body, 'test-all') }}
      cli: ${{ steps.backend.outputs.backend == 'rainbow' || steps.changes.outputs.cli == 'true' || contains(github.event.pull_request.body, 'test-cli') || contains(github.event.pull_request.body, 'test-all') }}
      db_divert: ${{ steps.changes.outputs.preview_db_full != 'true' }}
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      # Okteto unless the PR asks for a Rainbow parity run and its head branch
      # lives in this repository. This selects a path; it is not a security
      # boundary (a PR can edit this file). Fork PRs get no secrets anyway.
      - name: Select preview backend
        id: backend
        env:
          REQUESTED: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.body, 'rainbow-parity') }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          backend=okteto
          if [ "$REQUESTED" = true ] && [ "$SAME_REPO" = true ]; then
            backend=rainbow
          elif [ "$REQUESTED" = true ]; then
            echo "::warning::rainbow-parity requested, but this PR comes from a fork; using Okteto."
          fi
          echo "Preview backend: $backend"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Check for files changes
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
        id: changes
        with:
          token: ${{ github.token }}
          filters: .github/file-filters.yml

  openapi-breaking-change-check:
    if: needs.files-changed.outputs.api_schema == 'true'
    name: OpenAPI Breaking Change Check
    runs-on: depot-ubuntu-24.04-4
    needs: files-changed
    env:
      NODE_OPTIONS: "--max-old-space-size=8192"
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout base
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
      - name: Read Node pin from checked-out revision
        id: node-version
        run: echo "version=$(tr -d '[:space:]' < .nvmrc)" >> "$GITHUB_OUTPUT"

      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@${{ steps.node-version.outputs.version }}
          cache: true
          install: false

      - name: Generate base OpenAPI schema
        run: |
          pnpm install --frozen-lockfile --prefer-offline --network-concurrency=16
          pnpm generate-api
          cp packages/backend/src/generated/swagger.json /tmp/base-swagger.json
      - name: Checkout PR
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Generate PR OpenAPI schema
        run: |
          pnpm install --frozen-lockfile --prefer-offline --network-concurrency=16
          pnpm generate-api
      - name: Check for OpenAPI breaking changes
        if: ${{ !contains(github.event.pull_request.body, 'allow-api-breaking-change') }}
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -v /tmp:/tmp \
            -w /work \
            tufin/oasdiff@sha256:1b878e413bfba39a9bbb2ce95d6a2ddf79bacd4eade9420ad422175b011a71c9 \
            breaking --fail-on ERR /tmp/base-swagger.json packages/backend/src/generated/swagger.json
      - name: Report allowed OpenAPI breaking changes
        if: ${{ contains(github.event.pull_request.body, 'allow-api-breaking-change') }}
        run: echo "Skipping OpenAPI breaking-change check because allow-api-breaking-change is in the PR description."

  post-test-selection-comment:
    name: Post Test Selection Comment
    runs-on: depot-ubuntu-24.04-4
    needs: files-changed
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Post comment with test selection info
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const marker = '<!-- test-selection-comment -->';

            const tests = [
              {
                name: 'Preview Environment',
                selected: ${{ needs.files-changed.outputs.preview }},
                trigger: 'deploy-preview',
                description: 'Deploys a preview environment for testing'
              },
              {
                name: 'Frontend E2E Tests',
                selected: ${{ needs.files-changed.outputs.frontend }},
                trigger: 'test-frontend',
                description: 'Runs Cypress app tests'
              },
              {
                name: 'Backend API Tests',
                selected: ${{ needs.files-changed.outputs.backend }},
                trigger: 'test-backend',
                description: 'Runs Vitest API tests'
              },
              {
                name: 'Timezone Tests',
                selected: ${{ needs.files-changed.outputs.timezone }},
                trigger: 'test-timezone',
                description: 'Runs date/timezone E2E tests across multiple timezones'
              },
              {
                name: 'CLI Tests',
                selected: ${{ needs.files-changed.outputs.cli }},
                trigger: 'test-cli',
                description: 'Runs CLI integration and dbt version tests'
              }
            ];

            const selectedTests = tests.filter(t => t.selected);
            const unselectedTests = tests.filter(t => !t.selected);

            let body = `${marker}\n## 🧪 Test Selection\n\n`;

            if (selectedTests.length > 0) {
              body += `### ✅ Tests that will run\n`;
              body += `| Test | Description |\n|------|-------------|\n`;
              for (const test of selectedTests) {
                body += `| ${test.name} | ${test.description} |\n`;
              }
              body += '\n';
            }

            if (unselectedTests.length > 0) {
              body += `### ⏭️ Tests skipped (no relevant file changes detected)\n`;
              body += `| Test | How to trigger manually |\n|------|-------------------------|\n`;
              for (const test of unselectedTests) {
                body += `| ${test.name} | Add \`${test.trigger}\` to PR description |\n`;
              }
              body += '\n';
            }

            body += `> **Tip:** Add \`test-all\` to your PR description to run all tests.\n`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

  preview:
    timeout-minutes: 45
    name: Deploy Preview
    runs-on: depot-ubuntu-24.04-4
    needs: files-changed
    if: needs.files-changed.outputs.preview == 'true'
    outputs:
      url: ${{ steps.preview-url.outputs.url }}
    env:
      RAINBOW: ${{ needs.files-changed.outputs.preview_backend == 'rainbow' }}
      PREVIEW_URL: ${{ needs.files-changed.outputs.preview_backend == 'rainbow' && format('https://lightdash--pr-{0}.lightdash.rainbowmachine.dev', github.event.number) || format('https://lightdash-preview-pr-{0}.lightdash.okteto.dev', github.event.number) }}
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Context
        if: env.RAINBOW != 'true'
        uses: okteto/context@5212ce5ebf9d3584bafd33f4a295a8521fc5abe7 # latest
        with:
          url: ${{ secrets.OKTETO_CONTEXT }}
          token: ${{ secrets.OKTETO_TOKEN }}

      - name: Create GitHub deployment
        if: env.RAINBOW != 'true'
        id: deployment
        uses: chrnorm/deployment-action@500aa6a23c81ffa1acf71072aee3cfa2cc2e556a # v2
        with:
          token: ${{ secrets.CI_GITHUB_TOKEN }}
          initial-status: pending
          environment: pr-${{ github.event.number }}
          environment-url: ${{ env.PREVIEW_URL }}

      - name: Deploy preview environment
        if: env.RAINBOW != 'true'
        id: deploy
        uses: okteto/deploy-preview@86c45b05007dbdd42a5c8c74372f7a5912608827 # latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: pr-${{ github.event.number }}
          # Covers a bounded diverted attempt (18m) plus the blank-volume
          # retry with a full migrate + seed (see okteto.preview.yaml)
          timeout: 40m
          file: okteto.preview.yaml
          variables: SITE_URL=${{ env.PREVIEW_URL }},DB_DIVERT=${{ needs.files-changed.outputs.db_divert }},TURBO_TEAM=${{ vars.TURBO_TEAM }},TURBO_TOKEN=${{ secrets.TURBO_TOKEN }}

      - name: Collect failed preview diagnostics
        if: ${{ env.RAINBOW != 'true' && failure() && steps.deploy.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 3
        env:
          OKTETO_CONTEXT: ${{ secrets.OKTETO_CONTEXT }}
          OKTETO_TOKEN: ${{ secrets.OKTETO_TOKEN }}
          PREVIEW_NAMESPACE: pr-${{ github.event.number }}
        run: |
          curl -sSfL -o okteto https://github.com/okteto/okteto/releases/download/3.21.0/okteto-Linux-x86_64
          echo "f1fc644e2c2d2285a557577eafc6d4494410dce17b36bac6c3c269fc04c573ef  okteto" | sha256sum --check
          chmod +x okteto
          sudo mv okteto /usr/local/bin/okteto

          okteto context use "$OKTETO_CONTEXT" --token "$OKTETO_TOKEN" --namespace "$PREVIEW_NAMESPACE"
          okteto kubeconfig

          echo "::group::Preview pod status"
          kubectl -n "$PREVIEW_NAMESPACE" get pods -o wide || true
          echo "::endgroup::"

          echo "::group::Recent warning events"
          kubectl -n "$PREVIEW_NAMESPACE" get events \
            --field-selector type=Warning \
            --sort-by=.lastTimestamp | tail -n 100 || true
          echo "::endgroup::"

          preview_pods=$(kubectl -n "$PREVIEW_NAMESPACE" get pods \
            -l stack.okteto.com/service=lightdash-preview \
            -o name 2>/dev/null || true)

          if [ -z "$preview_pods" ]; then
            echo "No lightdash-preview pods found"
            exit 0
          fi

          while IFS= read -r preview_pod; do
            echo "::group::Current logs for $preview_pod"
            kubectl -n "$PREVIEW_NAMESPACE" logs "$preview_pod" \
              --all-containers=true --tail=300 --timestamps || true
            echo "::endgroup::"

            echo "::group::Previous logs for $preview_pod"
            kubectl -n "$PREVIEW_NAMESPACE" logs "$preview_pod" \
              --all-containers=true --previous --tail=300 --timestamps || true
            echo "::endgroup::"
          done <<< "$preview_pods"

      # Rainbow builds the preview itself on every push (GitHub App). Its
      # verdict is the `rainbow-machine/preview` commit status on the head
      # commit, so waiting on that status is the deploy, and the commit it
      # reports on is the commit the suites check out.
      - name: Wait for the Rainbow preview
        if: env.RAINBOW == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for i in $(seq 1 90); do
            status=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/status" --jq '.statuses[] | select(.context == "rainbow-machine/preview") | "\(.state) \(.description)"' | head -1)
            case "$status" in
              success*) echo "$status"; break ;;
              failure*|error*) echo "::error::$status"; exit 1 ;;
              *) echo "waiting (${i}/90): ${status:-no status yet}"; sleep 20 ;;
            esac
          done
          [ "${status#success}" != "$status" ] || { echo "::error::Rainbow preview not ready after 30 minutes"; exit 1; }
          # The dev service re-execs after Rainbow injects SITE_URL, so the first
          # probes after "success" can hit a backend still booting.
          curl -sSf --connect-timeout 5 --max-time 20 --retry 36 --retry-delay 5 --retry-all-errors -o /dev/null "$PREVIEW_URL/api/v1/health"
      - name: Set preview URL output
        id: preview-url
        run: echo "url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Update deployment status
        if: env.RAINBOW != 'true'
        uses: chrnorm/deployment-status@6df8d036fd2fee9eb82936733953da1f8382b41e # v2
        with:
          token: ${{ secrets.CI_GITHUB_TOKEN }}
          state: success
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          environment-url: ${{ env.PREVIEW_URL }}

      - name: Comment PR with preview info
        if: env.RAINBOW != 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const marker = '<!-- preview-environment-comment -->';
            const body = `${marker}
            ## Preview Environment

            🌐 **URL:** ${process.env.PREVIEW_URL}

            📋 **Logs:** [View in GCP Console](https://console.cloud.google.com/logs/query;query=resource.labels.namespace_name%3D%22pr-${context.issue.number}%22;duration=PT30M?project=lightdash-previews)

            🔧 **SSH:** \`./scripts/okteto-ssh.sh ${context.issue.number}\`
            `;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

  # ============================================================================
  # Stage 3: E2E and CLI tests (only after preview is up)
  # ============================================================================

  # Build cypress e2e image (only when E2E tests that use it will run)
  build-cypress-e2e-image:
    runs-on: depot-ubuntu-24.04-4
    needs: files-changed
    if: needs.files-changed.outputs.frontend == 'true' || needs.files-changed.outputs.timezone == 'true'
    name: Build E2E Image
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4
      - name: GitHub Registry Login
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7
        with:
          file: ./packages/e2e/dockerfile
          context: .
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ghcr.io/lightdash/lightdash-cypress-e2e:latest
          push: true

  api-tests:
    if: needs.files-changed.outputs.backend == 'true'
    timeout-minutes: 25
    runs-on: depot-ubuntu-24.04-4
    needs: [preview, files-changed]
    name: "E2E: API (Vitest)"
    env:
      PREVIEW_URL: ${{ needs.preview.outputs.url }}
      NODE_OPTIONS: "--max-old-space-size=8192"
      SNOWFLAKE_AI_STUB_URL: ${{ needs.files-changed.outputs.snowflake_ai_stub_url }}
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          cache: true
          install: false

      - name: Install packages
        run: pnpm install --frozen-lockfile --prefer-offline --network-concurrency=16
      - name: Build packages/common module
        run: pnpm common-build
      - name: Create BigQuery credentials file
        id: create-json
        uses: jsdaniell/create-json@b8e77fa01397ca39cc4a6198cc29a3be5481afef # v1.2.3
        with:
          name: "credentials.json"
          json: ${{ secrets.GCP_CREDENTIALS }}
          dir: "./packages/e2e/cypress/fixtures/"
      - name: Run API tests
        run: pnpm -F api-tests test:api
        env:
          SITE_URL: ${{ env.PREVIEW_URL }}
          PGHOST: ${{ secrets.PGHOST }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_PATH: ${{ secrets.DATABRICKS_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          TRINO_HOST: ${{ secrets.TRINO_HOST }}
          TRINO_PORT: ${{ secrets.TRINO_PORT }}
          TRINO_USER: ${{ secrets.TRINO_USER }}
          TRINO_PASSWORD: ${{ secrets.TRINO_PASSWORD }}
          # Warehouses this job's secrets provide; a missing one fails the run
          # instead of silently narrowing the parity suites to Postgres.
          REQUIRED_WAREHOUSES: "snowflake,bigquery,trino"
          TZ: "UTC"

  app-tests:
    if: needs.files-changed.outputs.frontend == 'true'
    timeout-minutes: 30
    runs-on: depot-ubuntu-24.04-4
    needs: [preview, files-changed, build-cypress-e2e-image]
    container:
      image: ghcr.io/lightdash/lightdash-cypress-e2e:latest
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        containers: [1, 2, 3, 4, 5]
    name: "E2E: App (${{ matrix.containers }}/${{ strategy.job-total }})"
    env:
      PREVIEW_URL: ${{ needs.preview.outputs.url }}
      NODE_OPTIONS: "--max-old-space-size=8192"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup Node, PNPM, and Cypress
        uses: ./.github/workflows/_setup_node_pnpm_cypress
      - name: Build packages/common module
        run: pnpm common-build
      - name: create-json
        id: create-json
        uses: jsdaniell/create-json@b8e77fa01397ca39cc4a6198cc29a3be5481afef # v1.2.3
        with:
          name: "credentials.json"
          json: ${{ secrets.GCP_CREDENTIALS }}
          dir: "./packages/e2e/cypress/fixtures/"
      - name: Warm preview
        run: node packages/e2e/warm-preview.mjs "$PREVIEW_URL"
      - name: Run Cypress
        uses: cypress-io/github-action@783cb3f07983868532cabaedaa1e6c00ff4786a8 # v7
        with:
          install: false
          browser: firefox
          working-directory: packages/e2e
          config: "baseUrl=${{ env.PREVIEW_URL }},specPattern=cypress/e2e/app/**/*.cy.{js,jsx,ts,tsx},video=false"
        env:
          SPLIT: ${{ strategy.job-total }}
          SPLIT_INDEX: ${{ strategy.job-index }}
          CYPRESS_PGHOST: ${{ secrets.PGHOST }}
          CYPRESS_PGPASSWORD: ${{ secrets.PGPASSWORD }}
          CYPRESS_DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          CYPRESS_DATABRICKS_PATH: ${{ secrets.DATABRICKS_PATH }}
          CYPRESS_DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          CYPRESS_SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          CYPRESS_SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          CYPRESS_SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          CYPRESS_TRINO_HOST: ${{ secrets.TRINO_HOST }}
          CYPRESS_TRINO_PORT: ${{ secrets.TRINO_PORT }}
          CYPRESS_TRINO_USER: ${{ secrets.TRINO_USER }}
          CYPRESS_TRINO_PASSWORD: ${{ secrets.TRINO_PASSWORD }}
          TZ: "UTC"
          CYPRESS_TZ: "UTC"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        if: failure()
        with:
          name: cypress-screenshots-and-videos-${{ strategy.job-index }}
          path: |
            packages/e2e/cypress/screenshots
            packages/e2e/cypress/videos
          if-no-files-found: ignore

  timezone-tests:
    if: needs.files-changed.outputs.timezone == 'true'
    timeout-minutes: 30
    runs-on: depot-ubuntu-24.04-4
    needs: [preview, files-changed, build-cypress-e2e-image]
    container:
      image: ghcr.io/lightdash/lightdash-cypress-e2e:latest
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        timezone: ["America/New_York", "Europe/Madrid", "Asia/Tokyo"]
    name: "E2E: Timezone (${{ matrix.timezone }})"
    env:
      PREVIEW_URL: ${{ needs.preview.outputs.url }}
      NODE_OPTIONS: "--max-old-space-size=8192"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup Node, PNPM, and Cypress
        uses: ./.github/workflows/_setup_node_pnpm_cypress
      - name: Build packages/common module
        run: pnpm common-build
      - name: create-json
        id: create-json
        uses: jsdaniell/create-json@b8e77fa01397ca39cc4a6198cc29a3be5481afef # v1.2.3
        with:
          name: "credentials.json"
          json: ${{ secrets.GCP_CREDENTIALS }}
          dir: "./packages/e2e/cypress/fixtures/"
      - name: Warm preview
        run: node packages/e2e/warm-preview.mjs "$PREVIEW_URL"
      - name: Run Cypress
        uses: cypress-io/github-action@783cb3f07983868532cabaedaa1e6c00ff4786a8 # v7
        with:
          install: false
          browser: firefox
          working-directory: packages/e2e
          spec: cypress/e2e/app/dates.cy.ts
          config: "baseUrl=${{ env.PREVIEW_URL }},video=false"
        env:
          TZ: ${{ matrix.timezone }}
          CYPRESS_TZ: ${{ matrix.timezone }}
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        if: failure()
        with:
          name: cypress-screenshots-and-videos-timezone-${{ strategy.job-index }}
          path: |
            packages/e2e/cypress/screenshots
            packages/e2e/cypress/videos
          if-no-files-found: ignore

  # CLI tests without dbt
  cli-tests-without-dbt:
    if: needs.files-changed.outputs.cli == 'true'
    timeout-minutes: 30
    runs-on: depot-ubuntu-24.04-4
    needs: [preview, files-changed]
    name: "CLI: Without dbt"
    env:
      PREVIEW_URL: ${{ needs.preview.outputs.url }}
      NODE_OPTIONS: "--max-old-space-size=8192"
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup Node, PNPM, and Cypress
        uses: ./.github/workflows/_setup_node_pnpm_cypress
        with:
          install-npm: true
      - name: Build packages/common module
        run: pnpm common-build
      - name: Build packages/warehouses module
        run: pnpm warehouses-build
      - name: Build and install packages/cli module
        run: cd packages/cli && pnpm build && npm install -g
      - name: Test lightdash version
        run: |
          lightdash_version=$(lightdash --version)
          package_version="$(pnpm m ls --depth=-1 | grep '@lightdash/cli@' | sed -E 's/.*@lightdash\/cli@([0-9.]+).*/\1/')"
          if [ $package_version = $lightdash_version ]; then exit 0 ; else echo "Version mismatch"; exit 1; fi
      - name: Warm preview
        run: node packages/e2e/warm-preview.mjs "$PREVIEW_URL"
      - name: Run Cypress
        uses: cypress-io/github-action@783cb3f07983868532cabaedaa1e6c00ff4786a8 # v7
        with:
          install: false
          working-directory: packages/e2e
          spec: cypress/cli/api,cypress/cli/yaml-only
          config: "baseUrl=${{ env.PREVIEW_URL }}"

  # CLI tests with dbt
  cli-tests:
    if: needs.files-changed.outputs.cli == 'true'
    timeout-minutes: 30
    runs-on: depot-ubuntu-24.04-4
    needs: [preview, files-changed]
    name: "CLI: Integration"
    env:
      PREVIEW_URL: ${{ needs.preview.outputs.url }}
      NODE_OPTIONS: "--max-old-space-size=8192"
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup Node, PNPM, and Cypress
        uses: ./.github/workflows/_setup_node_pnpm_cypress
        with:
          install-npm: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.10.x"
      - run: pip install dbt-core~=1.9.0 dbt-postgres~=1.9.0
      - name: Seed DBT
        run: dbt seed --profiles-dir $PROFILES_DIR --project-dir $PROJECT_DIR --full-refresh
        env:
          PROJECT_DIR: "./examples/full-jaffle-shop-demo/dbt"
          PROFILES_DIR: "./examples/full-jaffle-shop-demo/profiles"
          PGHOST: ${{ secrets.PGHOST }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: postgres
          SEED_SCHEMA: jaffle_cli_tests_${{ github.run_id }}
      - name: Run DBT
        run: dbt run --profiles-dir $PROFILES_DIR --project-dir $PROJECT_DIR --full-refresh
        env:
          PROJECT_DIR: "./examples/full-jaffle-shop-demo/dbt"
          PROFILES_DIR: "./examples/full-jaffle-shop-demo/profiles"
          PGHOST: ${{ secrets.PGHOST }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: postgres
          SEED_SCHEMA: jaffle_cli_tests_${{ github.run_id }}
      - name: Build packages/common module
        run: pnpm common-build
      - name: Build packages/warehouses module
        run: pnpm warehouses-build
      - name: Build and install packages/cli module
        run: cd packages/cli && pnpm build && npm install -g
      - name: Test lightdash version
        run: |
          lightdash_version=$(lightdash --version)
          package_version="$(pnpm m ls --depth=-1 | grep '@lightdash/cli@' | sed -E 's/.*@lightdash\/cli@([0-9.]+).*/\1/')"
          if [ $package_version = $lightdash_version ]; then exit 0 ; else echo "Version mismatch"; exit 1; fi
      - name: Warm preview
        run: node packages/e2e/warm-preview.mjs "$PREVIEW_URL"
      - name: Run Cypress
        uses: cypress-io/github-action@783cb3f07983868532cabaedaa1e6c00ff4786a8 # v7
        with:
          install: false
          working-directory: packages/e2e
          spec: cypress/cli/integration/*
          config: "baseUrl=${{ env.PREVIEW_URL }}"
        env:
          CYPRESS_PGHOST: ${{ secrets.PGHOST }}
          CYPRESS_PGPASSWORD: ${{ secrets.PGPASSWORD }}
          CYPRESS_SEED_SCHEMA: jaffle_cli_tests_${{ github.run_id }}

  # CLI dbt version tests
  cli-dbt-tests:
    if: needs.files-changed.outputs.cli == 'true'
    timeout-minutes: 30
    runs-on: depot-ubuntu-24.04-4
    needs: [preview, files-changed]
    strategy:
      fail-fast: false
      matrix:
        dbt: ["1.10", "1.11"]
    name: "CLI: dbt ${{ matrix.dbt }}"
    env:
      PREVIEW_URL: ${{ needs.preview.outputs.url }}
      NODE_OPTIONS: "--max-old-space-size=8192"
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup Node, PNPM, and Cypress
        uses: ./.github/workflows/_setup_node_pnpm_cypress
        with:
          install-npm: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.10.x"
      - run: |
          if [ "${{ matrix.dbt }}" = "1.11" ]; then
            pip install dbt-core~=${{ matrix.dbt }}.0 dbt-postgres~=1.10.0
          else
            pip install dbt-core~=${{ matrix.dbt }}.0 dbt-postgres~=${{ matrix.dbt }}.0
          fi
      - name: Seed DBT
        run: dbt seed --profiles-dir $PROFILES_DIR --project-dir $PROJECT_DIR --full-refresh
        env:
          PROJECT_DIR: "./examples/full-jaffle-shop-demo/dbt"
          PROFILES_DIR: "./examples/full-jaffle-shop-demo/profiles"
          PGHOST: ${{ secrets.PGHOST }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: postgres
          SEED_SCHEMA: jaffle_dbt_tests_${{ github.run_id }}_${{ strategy.job-index }}
      - name: Run DBT
        run: dbt run --profiles-dir $PROFILES_DIR --project-dir $PROJECT_DIR --full-refresh
        env:
          PROJECT_DIR: "./examples/full-jaffle-shop-demo/dbt"
          PROFILES_DIR: "./examples/full-jaffle-shop-demo/profiles"
          PGHOST: ${{ secrets.PGHOST }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: postgres
          SEED_SCHEMA: jaffle_dbt_tests_${{ github.run_id }}_${{ strategy.job-index }}
      - name: Build packages/common module
        run: pnpm common-build
      - name: Build packages/warehouses module
        run: pnpm warehouses-build
      - name: Build and install packages/cli module
        run: cd packages/cli && pnpm build && npm install -g
      - name: Test lightdash version
        run: |
          lightdash_version=$(lightdash --version)
          package_version="$(pnpm m ls --depth=-1 | grep '@lightdash/cli@' | sed -E 's/.*@lightdash\/cli@([0-9.]+).*/\1/')"
          if [ $package_version = $lightdash_version ]; then exit 0 ; else echo "Version mismatch"; exit 1; fi
      - name: Warm preview
        run: node packages/e2e/warm-preview.mjs "$PREVIEW_URL"
      - name: Run Cypress
        uses: cypress-io/github-action@783cb3f07983868532cabaedaa1e6c00ff4786a8 # v7
        with:
          install: false
          working-directory: packages/e2e
          spec: cypress/cli/dbt/*
          config: "baseUrl=${{ env.PREVIEW_URL }}"
        env:
          CYPRESS_PGHOST: ${{ secrets.PGHOST }}
          CYPRESS_PGPASSWORD: ${{ secrets.PGPASSWORD }}
          CYPRESS_SEED_SCHEMA: jaffle_dbt_tests_${{ github.run_id }}_${{ strategy.job-index }}

  # Cleanup job to drop all schemas created during CLI tests
  cleanup-schemas:
    if: always() && needs.files-changed.outputs.cli == 'true'
    runs-on: depot-ubuntu-24.04-4
    needs: [files-changed, cli-tests-without-dbt, cli-tests, cli-dbt-tests]
    name: Cleanup test schemas
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Drop test schemas
        run: |
          PATTERN="^(jaffle_cli_tests_${{ github.run_id }}|jaffle_dbt_tests_${{ github.run_id }}_[0-9]+)$"
          SCHEMAS=$(psql -t -c "SELECT schema_name FROM information_schema.schemata WHERE schema_name ~ '$PATTERN';")
          for schema in $SCHEMAS; do
              if [ -n "$schema" ]; then
                  echo "Dropping schema: $schema"
                  psql -c "DROP SCHEMA IF EXISTS \"$schema\" CASCADE;"
              fi
          done
          echo "Schema cleanup completed"
        env:
          PGHOST: ${{ secrets.PGHOST }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: postgres
