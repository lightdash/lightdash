name: Setup Node, PNPM, and Cypress

description: Sets up Node.js, PNPM, and Cypress in the caller's existing checkout.

inputs:
    install-npm:
        description: Install npm for downstream CLI installation tests.
        default: 'false'

runs:
    using: 'composite'
    steps:
        - name: Setup PNPM
          uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
          with:
              cache: true
              install: false

        - name: Install npm for CLI installation tests
          if: inputs.install-npm == 'true'
          run: |
              pnpm add -g npm@11.16.0 --config.minimumReleaseAge=4320
              echo "$(npm prefix -g)/bin" >> "$GITHUB_PATH"
          shell: bash

        - name: Install Dependencies
          run: pnpm install --frozen-lockfile --prefer-offline --network-concurrency=16
          shell: bash

        - name: Install Cypress
          run: pnpm exec cypress install
          working-directory: packages/e2e
          shell: bash
