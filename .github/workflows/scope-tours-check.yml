name: Scope walkthrough checks

# Generation checks for scope walkthroughs (CS-209): every rule the first
# modules settled by hand, enforced on any change to the frontend markers or
# the generator. Unrelated frontend edits use committed walkthroughs; docs
# are only needed when walkthrough inputs change.

on:
    pull_request:
        paths:
            - 'packages/frontend/src/**'
            - 'packages/common/src/authorization/**'
            - 'scripts/scope-tours/**'
            - 'scripts/playground-bundle/**'
            - 'packages/backend/assets/playground/content.json'
            - 'packages/backend/assets/learn/**'
            - 'packages/backend/assets/playground/explores.json'
            - 'examples/full-jaffle-shop-demo/dbt/**'
            - 'package.json'
            - 'scripts/scope-tours/scope-tours.test.ts'
            - '.github/workflows/scope-tours-check.yml'
            - '.github/workflows/_prepare_scope_tours/**'

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
              with:
                  egress-policy: audit
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
            - uses: ./.github/workflows/_setup_node_pnpm_cypress
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
              with:
                  fetch-depth: 0
                  clean: false
            - name: Walkthrough CI fallback tests
              run: node --test .github/workflows/_prepare_scope_tours/action.test.mjs
            - name: Detect walkthrough input changes
              id: inputs
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: |
                  git diff --unified=0 "$BASE_SHA...$HEAD_SHA" -- packages/frontend/src > "$RUNNER_TEMP/walkthrough-inputs.diff"
                  if [ -n "$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- scripts/scope-tours packages/frontend/src/features/learn/sandboxLessons.ts packages/common/src/authorization packages/backend/assets/learn packages/frontend/src/Routes.tsx packages/frontend/src/ee/CommercialRoutes.tsx packages/frontend/src/pages/Settings.tsx packages/frontend/src/components/Settings/ProjectSettings.tsx)" ] || grep -Eq '^[+-].*data-tour-' "$RUNNER_TEMP/walkthrough-inputs.diff"; then
                    echo 'strict=true' >> "$GITHUB_OUTPUT"
                  else
                    echo 'strict=false' >> "$GITHUB_OUTPUT"
                  fi
            - name: Build common
              run: pnpm common-build
            - name: Checker tests
              run: pnpm exec tsx scripts/scope-tours/scope-tours.test.ts
            - name: Playground teaching samples survive a bundle rebuild
              run: pnpm test:playground-content
            - name: Validate changed walkthrough inputs
              if: steps.inputs.outputs.strict == 'true'
              uses: ./.github/workflows/_prepare_scope_tours
              with:
                  docs-token: ${{ secrets.MINTLIFY_DOCS_READ_TOKEN || github.token }}
                  strict: 'true'
            - name: Content coverage tests
              run: pnpm scope-tours:coverage:test
            - name: Every curriculum permission has a walkthrough or explicit disposition
              run: pnpm scope-tours:release-check
            - name: Point the author at the guide
              if: failure()
              env:
                  GUIDE_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/docs/learn/maintaining-walkthroughs.md
              run: |
                  echo "::error title=Learn walkthrough checks failed::A walkthrough is built from data-tour-* attributes in the frontend. What the failed step means and who fixes it: docs/learn/maintaining-walkthroughs.md"
                  {
                      echo '### Learn walkthrough checks failed'
                      echo
                      echo "A walkthrough is built from \`data-tour-*\` attributes in the frontend. The first failed step above is the one to read; [maintaining-walkthroughs.md]($GUIDE_URL) explains what it means and who fixes it."
                  } >> "$GITHUB_STEP_SUMMARY"
