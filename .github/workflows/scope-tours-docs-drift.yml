name: Scope tours docs drift

# Tells people when the docs have moved past the commit the scope walkthrough
# check is pinned to (scripts/scope-tours/docs-pin.txt). It only opens, updates
# or closes one issue. It uses the default GITHUB_TOKEN with contents: read and
# issues: write, no secrets, and it makes no commits and opens no pull
# requests. On a pull request that touches this file it only compares and
# prints the result, so the permissions are checked on a branch run before
# anyone relies on the schedule.

on:
    schedule:
        - cron: '0 6 * * 1-5'
    workflow_dispatch:
    pull_request:
        paths:
            - '.github/workflows/scope-tours-docs-drift.yml'

permissions:
    contents: read
    issues: write

concurrency:
    group: scope-tours-docs-drift
    cancel-in-progress: false

jobs:
    drift:
        runs-on: ubuntu-latest
        env:
            GH_TOKEN: ${{ github.token }}
            GH_REPO: ${{ github.repository }}
            ISSUE_TITLE: The scope tours docs pin is behind the docs
            PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        steps:
            - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
              with:
                  egress-policy: audit
            - name: Compare the docs with the pin
              id: compare
              run: |
                  # No checkout and no secret: both reads use the job's own token
                  # (contents: read). An anonymous read is rate-limited per IP and
                  # shared runners can hit that limit, so none is used. If either
                  # read is refused the job fails; it never falls back to a secret.
                  # On a pull request the pin is read at the PR head, because the
                  # file is not on the default branch until the PR merges.
                  pin=$(gh api "repos/${GITHUB_REPOSITORY}/contents/scripts/scope-tours/docs-pin.txt${PR_HEAD_SHA:+?ref=$PR_HEAD_SHA}" --jq .content | base64 -d | tr -d '[:space:]')
                  head=$(gh api repos/lightdash/mintlify-docs/commits/HEAD --jq .sha)
                  for sha in "$pin" "$head"; do
                      echo "$sha" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::Not a full commit SHA: '$sha'"; exit 1; }
                  done
                  number=$(gh issue list --state open --search "\"$ISSUE_TITLE\" in:title" --json number,title --jq 'map(select(.title == env.ISSUE_TITLE)) | .[0].number // empty')
                  echo "pin=$pin" >> "$GITHUB_OUTPUT"
                  echo "head=$head" >> "$GITHUB_OUTPUT"
                  echo "number=$number" >> "$GITHUB_OUTPUT"
                  echo "Pin ${pin:0:8}, docs head ${head:0:8}, open issue: ${number:-none}" >> "$GITHUB_STEP_SUMMARY"
            - name: Close the issue when the pin has caught up
              if: github.event_name != 'pull_request' && steps.compare.outputs.pin == steps.compare.outputs.head && steps.compare.outputs.number != ''
              env:
                  NUMBER: ${{ steps.compare.outputs.number }}
                  PIN: ${{ steps.compare.outputs.pin }}
              run: gh issue close "$NUMBER" --comment "The pin is at ${PIN:0:8}, the current docs head."
            - name: Open or update the issue
              if: github.event_name != 'pull_request' && steps.compare.outputs.pin != steps.compare.outputs.head
              env:
                  NUMBER: ${{ steps.compare.outputs.number }}
                  PIN: ${{ steps.compare.outputs.pin }}
                  HEAD_SHA: ${{ steps.compare.outputs.head }}
              run: |
                  count=$(gh api "repos/lightdash/mintlify-docs/compare/${PIN}...${HEAD_SHA}" --jq .total_commits 2>/dev/null || echo "an unknown number of")
                  {
                      echo "The scope walkthrough check is pinned to docs commit \`${PIN:0:8}\`. The docs default branch is now at \`${HEAD_SHA:0:8}\`, ${count} commits ahead."
                      echo
                      echo "Until the pin moves, the tours keep the text of the pinned docs. Changes in this range: https://github.com/lightdash/mintlify-docs/compare/${PIN}...${HEAD_SHA}"
                      echo
                      echo "To move the pin, from a lightdash checkout with the docs cloned beside it:"
                      echo
                      echo '```'
                      echo "pnpm scope-tours:bump-docs -- --dry-run"
                      echo "pnpm scope-tours:bump-docs"
                      echo '```'
                      echo
                      echo "Read the changed-steps table and the diff before opening the pull request: each changed card must still match its step title."
                      echo
                      echo "This issue is updated by the Scope tours docs drift workflow and closes when the pin catches up."
                  } > "$RUNNER_TEMP/drift-body.md"
                  if [ -n "$NUMBER" ]; then
                      gh issue edit "$NUMBER" --body-file "$RUNNER_TEMP/drift-body.md"
                  else
                      gh issue create --title "$ISSUE_TITLE" --body-file "$RUNNER_TEMP/drift-body.md"
                  fi
