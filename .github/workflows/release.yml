name: Build & Release
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string

jobs:
  build-and-test:
    if: ${{ github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore(release):') }}
    name: Build & Test
    runs-on: depot-ubuntu-24.04-8
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_API: https://cache.depot.dev
      NODE_OPTIONS: '--max-old-space-size=8192'
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          save-cache: false
          install: false

      - name: Install packages
        run: pnpm install --frozen-lockfile --prefer-offline --network-concurrency=16
      - name: Generate backend API artifacts
        run: pnpm generate-api:backend
      - name: Build all packages
        run: pnpm build

  release:
    if: ${{ github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore(release):') }}
    # Must stay on a GitHub-hosted runner: npm's trusted-publishing provenance
    # rejects self-hosted/Depot runners (422 "Unsupported GitHub Actions runner
    # environment", run 31724064116).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_git_tag: ${{ steps.semantic.outputs.new_release_git_tag }}
    # Deliberately no `needs: build-and-test`: a broken build aborts
    # semantic-release during prepare, before the git plugin pushes the
    # chore commit/tag, so gating on the build only adds serial latency.
    concurrency: ${{ github.ref }}
    permissions:
      contents: read
      id-token: write  # Required for OIDC trusted publishing (pnpm publish is native since pnpm 11)
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          token: ${{ secrets.CI_GITHUB_TOKEN }}
          persist-credentials: false
          # Full history for semantic-release, but blobless: old file contents
          # are fetched on demand (the release-safety oasdiff step pulls the
          # previous tag's swagger.json lazily).
          fetch-depth: 0
          filter: blob:none
          # Tags arrive blobless at checkout (~1s) so semantic-release's own
          # `git fetch --tags` during getLastRelease becomes a no-op instead of
          # transferring all 7k+ tags (~63s measured on the 1.152.0 release).
          fetch-tags: true

      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          save-cache: false
          install: false

      # pnpm publishes natively via OIDC trusted publishing; npm is pinned only
      # for the npm version prepare step in release.config.js.
      - name: Pin npm for the versioning step
        run: pnpm add -g npm@12.0.1 --config.minimumReleaseAge=4320

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline --config.production=false --network-concurrency=16

      # PROD-8359: install oasdiff so the release-safety marker generator can diff
      # the REST API (swagger.json) between the previous tag and HEAD for breaking
      # changes (api.rest). Pinned + sha256-verified; the download goes over the
      # harden-runner audited egress (not a package install, so no Socket Firewall
      # wrapper). When present on PATH the generator runs the diff automatically.
      - name: Install oasdiff
        env:
          OASDIFF_VERSION: '1.21.0'
          OASDIFF_SHA256: '293811c172672e9e86313ef925f136d8a2352c7b56937f6b0f91c5de1166bd8f'
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/oasdiff.tar.gz \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          echo "${OASDIFF_SHA256}  /tmp/oasdiff.tar.gz" | sha256sum -c -
          tar -xzf /tmp/oasdiff.tar.gz -C /tmp oasdiff
          sudo install -m 0755 /tmp/oasdiff /usr/local/bin/oasdiff
          oasdiff --version

      - name: Semantic Release
        # Config is on release.config.js
        id: semantic
        uses: cycjimmy/semantic-release-action@16ca923e6ccbb50770c415a0ccd43709a8c5f7a4 # v4
        env:
          HUSKY: 0
          GITHUB_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
          # PROD-8359: powers the gated AI migration review (P6) in the marker
          # generator. The review reaches api.anthropic.com over the harden-runner
          # audited egress; absent the key, the generator skips it and leaves the
          # honest "unknown" verdict. Never fails the release.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # PROD-8359 kill-switch (GO-LIVE). "true" → on every release the generator
          # writes release-safety.json and the cumulative index, renders upgrade
          # notes, runs the gated AI review, and publishes the per-release asset.
          # Flip back to "false" to keep the committed unknown placeholder, skip
          # the asset and AI spend, and make every consumer take the unsafe path.
          RELEASE_SAFETY_MARKER_ENABLED: 'true'
        with:
          semantic_version: 19
          extra_plugins: |
            @semantic-release/changelog@6
            @semantic-release/exec@6
            @semantic-release/git@10
            @semantic-release/github@8

  publish-npm-packages:
    name: Publish npm Packages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    needs: release
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release.outputs.new_release_published == 'true') }}
    outputs:
      version: ${{ steps.release-version.outputs.version }}
      gated: ${{ steps.release-version.outputs.gated }}
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          token: ${{ secrets.CI_GITHUB_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release.outputs.new_release_git_tag }}

      # Read once here so all three npm jobs in this run use the same mode.
      - name: Read release version and npm gating mode
        id: release-version
        env:
          NPM_GATED_LATEST: ${{ vars.NPM_GATED_LATEST }}
        run: |
          set -euo pipefail
          echo "version=$(jq -r .version packages/cli/package.json)" >> "$GITHUB_OUTPUT"
          if [ "$NPM_GATED_LATEST" = 'true' ]; then gated=true; else gated=false; fi
          echo "gated=$gated" >> "$GITHUB_OUTPUT"

      - name: Read Node pin from checked-out revision
        id: node-version
        run: echo "version=$(tr -d '[:space:]' < .nvmrc)" >> "$GITHUB_OUTPUT"

      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@${{ steps.node-version.outputs.version }}
          cache: true
          save-cache: false
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline --config.production=false --network-concurrency=16

      - name: Generate backend API artifacts
        run: pnpm generate-api:backend

      - name: Build published packages
        run: pnpm build-published-packages

      # Recovery: wait for accepted versions on npm, then rerun failed jobs (newest release only).
      # With vars.NPM_GATED_LATEST == 'true', publish to `pending`; promote-npm-latest moves `latest`.
      - name: Publish npm packages
        env:
          # Wait for npm's malware scan before publishing dependent packages.
          PNPM_CONFIG_PUBLISH_WAIT_TIMEOUT: '3600000'
          GATED: ${{ steps.release-version.outputs.gated }}
        run: |
          if [ "$GATED" = 'true' ]; then
            pnpm release-packages --tag pending
          else
            pnpm release-packages
          fi

  # npm can list a version before its tarball downloads, and a 404 can stay
  # cached for about 5 minutes. Move `latest` only after every tarball still
  # downloads after that window, and only forward. Without NPM_GATED_LATEST,
  # this job sets the unused `pending` tag to rehearse and never fails the run.
  promote-npm-latest:
    name: Promote npm latest
    # Must stay on a GitHub-hosted runner for npm trusted publishing (see `release`).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    needs: publish-npm-packages
    if: ${{ !cancelled() && needs.publish-npm-packages.result == 'success' }}
    continue-on-error: ${{ needs.publish-npm-packages.outputs.gated != 'true' }}
    concurrency:
      group: npm-promote-latest
      cancel-in-progress: false
      queue: max
    env:
      VERSION: ${{ needs.publish-npm-packages.outputs.version }}
      TAG: ${{ needs.publish-npm-packages.outputs.gated == 'true' && 'latest' || 'pending' }}
      SOAK_SECONDS: ${{ vars.NPM_GATE_SOAK_SECONDS || '330' }}
      PACKAGES: common visualization warehouses query-sdk sdk cli
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      # Only for pnpm/setup to read the pinned pnpm version. No `pnpm install`.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          sparse-checkout: .github

      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: false
          install: false

      - name: Wait until every tarball downloads
        run: |
          set -euo pipefail
          check_all() {
            for p in $PACKAGES; do
              url=$(curl -fsS "https://registry.npmjs.org/@lightdash/$p/$VERSION" | jq -er .dist.tarball) || return 1
              curl -fsS -o /dev/null "$url" || { echo "@lightdash/$p@$VERSION: tarball not downloadable yet"; return 1; }
            done
          }
          while true; do
            until check_all; do sleep 30; done
            echo "All tarballs download. Checking again in ${SOAK_SECONDS}s."
            sleep "$SOAK_SECONDS"
            if check_all; then break; fi
          done

      - name: Move ${{ env.TAG }} forward
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          for p in $PACKAGES; do
            pkg="@lightdash/$p"
            current=$(curl -fsS "https://registry.npmjs.org/-/package/$pkg/dist-tags" | jq -r --arg tag "$TAG" '.[$tag] // "0.0.0"')
            newest=$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -n 1)
            if [ "$current" = "$VERSION" ] || [ "$newest" != "$VERSION" ]; then
              echo "$pkg: $TAG is $current, not moving it to $VERSION"
              continue
            fi
            pnpm dist-tag add "$pkg@$VERSION" "$TAG"
            for _ in 1 2 3 4 5 6; do
              after=$(curl -fsS "https://registry.npmjs.org/-/package/$pkg/dist-tags" | jq -r --arg tag "$TAG" '.[$tag] // ""')
              [ "$after" = "$VERSION" ] && break
              sleep 5
            done
            [ "$after" = "$VERSION" ] || { echo "::error::$pkg: $TAG reads '$after' after the move, expected $VERSION"; exit 1; }
          done
