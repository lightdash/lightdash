name: Cleanup Preview Environment

on:
  pull_request:
    types:
      - closed

permissions:
  deployments: write
  contents: read
  actions: write

jobs:
  # A merged or closed PR loses its preview within seconds (Rainbow kills the
  # env on the closed webhook; Okteto's is destroyed below), so a PR Checks
  # run still on its E2E stage can only fail against a preview that is gone.
  # Cancel it instead of letting it finish red.
  cancel-pr-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel PR Checks still running for this PR
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.event.pull_request.head.ref }}
        run: |
          for status in queued in_progress waiting; do
            gh run list --repo "$GITHUB_REPOSITORY" --workflow pr.yml --branch "$HEAD" --event pull_request \
              --status "$status" --json databaseId --jq '.[].databaseId'
          done | sort -u | while read -r id; do
            echo "cancelling PR Checks run $id"
            gh run cancel --repo "$GITHUB_REPOSITORY" "$id" || true
          done

  closed:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Context
        uses: okteto/context@5212ce5ebf9d3584bafd33f4a295a8521fc5abe7 # latest
        with:
          url: ${{secrets.OKTETO_CONTEXT}}
          token: ${{ secrets.OKTETO_TOKEN }}

      # Ideally would clean up deployment status
      # but unsure how to obtain the environment id from
      # the preview.yml workflow

      - name: Destroy preview environment
        uses: okteto/destroy-preview@f1897ba6c598f134ced128fb01c56ff5e9c92f73 # latest
        with:
          name: pr-${{ github.event.number }} 