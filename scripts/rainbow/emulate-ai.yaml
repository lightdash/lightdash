            *Example:* out of 1,000 orders placed on Monday, 789 reached processing by Friday. The gap is normal when it matches last month, and worth a look when it grows week over week. The [weekly funnel](https://example.com/funnel/3) shows the trend.

            Before you publish a number for this status:

            - Check the counts sum to the total.
            - Compare orders of the same age, see [cohort rules](https://example.com/cohort/3).
            - State which date field you used.

