# Scripted model replies for the emulated AI service (emulate@0.14.0, `ai`).
# An env opts in with AI_DEFAULT_PROVIDER=openai and
# OPENAI_BASE_URL=http://localhost:4014/v1 (with any OPENAI_API_KEY set).
# Every streamed agent turn gets the guide: the app may append context as a
# later user message, so matching on prompt text misses.
ai:
  strict: false
  timing:
    ttftMs: 300
    chunkDelayMs: 15
  rules:
    - id: long-markdown-answer
      match: { format: openai-responses, stream: true }
      reply:
        - type: text
          text: |
            ## Order status guide

            This answer is scripted by the preview's emulated model. Each section is a finished block once the next one starts streaming, and most paragraphs carry a link.

            ### 1. Pending

            Orders in **Pending** have passed every earlier step of the lifecycle. Count them separately from the neighbouring statuses, because each one answers a different question about revenue, stock and customer promises. Read the [pending definition](https://example.com/status/1) before comparing teams.

            *Example:* out of 1,000 orders placed on Monday, 863 reached pending by Friday. The gap is normal when it matches last month, and worth a look when it grows week over week. The [weekly funnel](https://example.com/funnel/1) shows the trend.

            ### 2. Confirmed

            Orders in **Confirmed** have passed every earlier step of the lifecycle. Count them separately from the neighbouring statuses, because each one answers a different question about revenue, stock and customer promises. Read the [confirmed definition](https://example.com/status/2) before comparing teams.

            *Example:* out of 1,000 orders placed on Monday, 826 reached confirmed by Friday. The gap is normal when it matches last month, and worth a look when it grows week over week. The [weekly funnel](https://example.com/funnel/2) shows the trend.

