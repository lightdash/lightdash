# GKE Agent Sandbox resources for python query sandboxes
# (SANDBOX_PROVIDER=gke-agent-sandbox). Apply to a cluster with the Agent
# Sandbox add-on, a gVisor node pool and network policy enforcement.
#
# The add-on's default (Managed) network policy allows public internet egress,
# so the template opts out and the NetworkPolicy below denies all traffic.
# Commands reach the pod through the kubelet exec API, which it doesn't affect.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata: {name: python-runner, namespace: sandboxes}
spec:
  networkPolicyManagement: Unmanaged
  podTemplate:
    metadata:
      labels: {app: python-runner}
    spec:
      runtimeClassName: gvisor
      nodeSelector: {sandbox.gke.io/runtime: gvisor}
      tolerations: [{key: sandbox.gke.io/runtime, operator: Equal, value: gvisor, effect: NoSchedule}]
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 0
      securityContext: {runAsUser: 1000, runAsGroup: 1000, runAsNonRoot: true}
      containers:
      - name: runner
        image: <your-registry>/lightdash-python-runner:<lightdash-version>
        command: ["python3","-I","-c","import numpy, pandas, scipy.stats, pyarrow; from pathlib import Path; import time; Path('/tmp/python-warm-ready').touch(); time.sleep(10**9)"]
        readinessProbe:
          exec: {command: ["test","-f","/tmp/python-warm-ready"]}
          periodSeconds: 1
        resources:
          requests: {cpu: "1", memory: 1Gi}
          limits: {cpu: "1", memory: 1Gi}
        securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata: {name: python-runner, namespace: sandboxes}
spec:
  replicas: 20
  sandboxTemplateRef: {name: python-runner}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: python-runner-deny-all, namespace: sandboxes}
spec:
  podSelector: {matchLabels: {app: python-runner}}
  policyTypes: [Ingress, Egress]
