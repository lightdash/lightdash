<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link rel="icon" href="/favicon.ico" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#394b59" />
        <meta
            name="description"
            content="Lightdash - Explore and visualize your team's analytics and metrics."
        />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <!--
          manifest.json provides metadata used when your web app is installed on a
          user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
        -->
        <link rel="manifest" href="/manifest.json" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
            rel="stylesheet"
        />

        <title>Lightdash</title>
        <script>
            // Paint the first frame in the right scheme, before React mounts.
            // Mirrors the resolution in src/providers/MantineProvider.tsx.
            (function () {
                try {
                    var preference = 'light';
                    if (location.pathname.indexOf('/embed') === 0) {
                        preference =
                            new URLSearchParams(location.search).get('theme') ||
                            'light';
                    } else {
                        var stored = localStorage.getItem('color-scheme');
                        if (stored) preference = JSON.parse(stored);
                    }
                    var scheme =
                        preference === 'system'
                            ? matchMedia('(prefers-color-scheme: dark)').matches
                                ? 'dark'
                                : 'light'
                            : preference === 'dark'
                              ? 'dark'
                              : 'light';
                    document.documentElement.setAttribute(
                        'data-mantine-color-scheme',
                        scheme,
                    );
                    document.documentElement.style.colorScheme = scheme;
                    document.addEventListener('DOMContentLoaded', function () {
                        document.body.dataset.colorMode = scheme;
                    });
                } catch (e) {}
            })();
        </script>
    </head>
    <body data-color-mode="light">
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>

        <script type="module" src="/src/index.tsx"></script>
    </body>
</html>
