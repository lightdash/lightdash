config:
    send_anonymous_usage_stats: false

multi_repo_sim:
    target: dev
    outputs:
        dev:
            type: postgres
            host: "{{ env_var('PGHOST') }}"
            port: "{{ env_var('PGPORT') | int }}"
            user: "{{ env_var('PGUSER') }}"
            password: "{{ env_var('PGPASSWORD') }}"
            dbname: "{{ env_var('PGDATABASE') }}"
            schema: sim
            threads: 4
            sslmode: disable
