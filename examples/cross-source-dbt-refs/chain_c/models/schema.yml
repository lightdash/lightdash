version: 2
models:
  - name: agg_orders_by_year
    access: public
    config:
      meta:
        primary_key: calendar_year
        metrics:
          row_count:
            type: count
            sql: ${TABLE}.calendar_year
    columns:
      - name: calendar_year
        meta:
          dimension:
            type: number
      - name: order_count
        meta:
          dimension:
            type: number
      - name: revenue
        meta:
          dimension:
            type: number
