version: 2
groups:
  - name: scale_internal
    owner:
      name: Scale fixture owner
      email: scale@example.com
models:
  - name: scale_08_versioned_product
    access: public
    latest_version: 2
    versions:
      - v: 1
      - v: 2
    config:
      meta:
        primary_key: id
        metrics: &row_metrics
          row_count:
            type: count
            sql: ${TABLE}.id
        joins:
          - join: scale_00_fanout__customers
            sql_on: ${scale_08_versioned_product.id} = ${scale_00_fanout__customers.id}
            relationship: one-to-one
    columns: &typed_columns
      - name: id
        meta:
          dimension:
            type: number
      - name: label
        meta:
          dimension:
            type: string
      - name: amount
        meta:
          dimension:
            type: number
      - name: active
        meta:
          dimension:
            type: boolean
      - name: event_date
        meta:
          dimension:
            type: date
  - name: scale_08_versioned_private
    access: private
    group: scale_internal
    config:
      meta:
        primary_key: id
        metrics: *row_metrics
    columns: *typed_columns
  - name: scale_08_versioned_protected
    access: protected
    config:
      meta:
        primary_key: id
        metrics: *row_metrics
    columns: *typed_columns
  - name: scale_08_versioned_internal
    access: public
    group: scale_internal
    config:
      meta:
        primary_key: id
        metrics: *row_metrics
    columns: *typed_columns
