version: 2
groups:
  - name: scale_internal
    owner:
      name: Scale fixture owner
      email: scale@example.com
models:
  - name: scale_15_chain_0000
    access: public
    config:
      meta:
        primary_key: id
        metrics: &row_metrics
          row_count:
            type: count
            sql: ${TABLE}.id
        joins:
          - join: scale_00_fanout__customers
            sql_on: ${scale_15_chain_0000.id} = ${scale_00_fanout__customers.id}
            relationship: one-to-one
          - join: scale_14_chain_0000
            sql_on: ${scale_15_chain_0000.id} = ${scale_14_chain_0000.id}
            relationship: one-to-one
    columns: &typed_columns
      - name: id
        meta:
          dimension:
            type: number
      - name: label
        meta:
          dimension:
            type: string
      - name: amount
        meta:
          dimension:
            type: number
      - name: active
        meta:
          dimension:
            type: boolean
      - name: event_date
        meta:
          dimension:
            type: date
