version: 2
models:
  - name: joined_days
    access: public
    config:
      meta:
        primary_key: calendar_date
        metrics:
          row_count:
            type: count
            sql: ${TABLE}.calendar_date
    columns:
      - name: calendar_date
        meta:
          dimension:
            type: date
      - name: left_year
        meta:
          dimension:
            type: number
      - name: right_year
        meta:
          dimension:
            type: number
