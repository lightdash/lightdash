name: Plan a Lightdash upgrade
description: Find the newest safe Lightdash release and open a version pin pull request
inputs:
  bump_target:
    description: Relative YAML or JSON file and value path in file#path.to.version format
    required: true
  branch_prefix:
    description: Prefix used for upgrade branch names
    required: false
    default: lightdash-upgrade
  tag_suffix:
    description: Suffix appended to the public release version for the deployed image tag
    required: false
    default: ''
  registry_check:
    description: Optional OCI image repository whose mapped tag must exist before a pull request opens
    required: false
    default: ''
  safety_gate:
    description: Use the release-safety gate to select an upgrade target
    required: false
    default: 'true'
  auto_merge:
    description: Enable pull request auto-merge when the upgrade gate is green
    required: false
    default: 'false'
  escalation:
    description: Optional Slack incoming webhook from a repository secret; never commit the URL in plaintext
    required: false
    default: ''
  freeze_label:
    description: Open-issue label that disarms upgrade planning
    required: false
    default: upgrade-freeze
  hold_label:
    description: Label applied to a held upgrade pull request and removed once it is green; empty disables label management, and label failures never fail planning
    required: false
    default: upgrade-hold
  hold_reminder_interval:
    description: Minimum time between repeated Slack escalations for a pull request that stays held. Accepts seconds or an s, m, or h suffix; 0 disables reminders
    required: false
    default: 24h
  anthropic_api_key:
    description: Optional Anthropic API key from a repository secret. When set, the body of a held pull request gains one Claude-written paragraph above the release facts; the facts are the same with or without it
    required: false
    default: ''
  github_token:
    description: GitHub token used to inspect issues, create the pin commit, and manage its pull request
    required: true
outputs:
  branch:
    description: Upgrade branch name, or empty when no pull request is created or updated
    value: ${{ steps.plan.outputs.branch }}
  pr_number:
    description: Upgrade pull request number, or empty when no pull request is created or updated
    value: ${{ steps.plan.outputs.pr_number }}
  pr_url:
    description: Upgrade pull request URL, or empty when no pull request is created or updated
    value: ${{ steps.plan.outputs.pr_url }}
runs:
  using: composite
  steps:
    - name: Plan and open the upgrade pull request
      id: plan
      shell: bash
      env:
        BUMP_TARGET: ${{ inputs.bump_target }}
        BRANCH_PREFIX: ${{ inputs.branch_prefix }}
        TAG_SUFFIX: ${{ inputs.tag_suffix }}
        REGISTRY_CHECK: ${{ inputs.registry_check }}
        SAFETY_GATE: ${{ inputs.safety_gate }}
        AUTO_MERGE: ${{ inputs.auto_merge }}
        ESCALATION: ${{ inputs.escalation }}
        FREEZE_LABEL: ${{ inputs.freeze_label }}
        HOLD_LABEL: ${{ inputs.hold_label }}
        HOLD_REMINDER_INTERVAL: ${{ inputs.hold_reminder_interval }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        GH_TOKEN: ${{ inputs.github_token }}
      run: "$GITHUB_ACTION_PATH/../scripts/plan.sh"
