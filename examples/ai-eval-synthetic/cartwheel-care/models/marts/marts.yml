  - name: student_terms
    description: "District SIS attendance and discipline per referred student per term, with care status in that term."
    config:
      meta:
        primary_key: student_term_id
        label: "Student Terms"
        spotlight:
          categories: [outcomes]
        joins:
          - join: students
            type: left
            sql_on: ${student_terms.student_id} = ${students.student_id}
            relationship: many-to-one
          - join: schools
            type: left
            sql_on: ${student_terms.school_id} = ${schools.school_id}
            relationship: many-to-one
          - join: districts
            type: left
            sql_on: ${student_terms.district_id} = ${districts.district_id}
            relationship: many-to-one
        metrics:
          overall_absence_rate:
            type: number
            sql: "1.0 * sum(${TABLE}.days_absent) / nullif(sum(${TABLE}.days_enrolled), 0)"
            label: "Absence Rate"
            description: "Days absent divided by days enrolled across the selected student terms."
            format: percent
            round: 1
          chronic_absenteeism_rate:
            type: number
            sql: "1.0 * sum(case when ${TABLE}.is_chronically_absent then 1 else 0 end) / nullif(count(distinct ${TABLE}.student_term_id), 0)"
            label: "Chronic Absenteeism Rate"
            description: "Student terms with 10% or more school days missed."
            format: percent
            round: 1
          suspensions_per_100_students:
            type: number
            sql: "100.0 * sum(${TABLE}.suspensions) / nullif(count(distinct ${TABLE}.student_term_id), 0)"
            label: "Suspensions per 100 Student Terms"
            description: "Suspensions divided by student terms, multiplied by 100. Comparisons by care status are observational."
            round: 1
          suspension_rate:
            type: number
            sql: "1.0 * sum(case when ${TABLE}.was_suspended then 1 else 0 end) / nullif(count(distinct ${TABLE}.student_term_id), 0)"
            label: "Students Suspended"
            format: percent
            round: 1
    columns:
      - name: student_term_id
        data_tests: [unique, not_null]
        config:
          meta:
            dimension:
              type: string
              hidden: true
            metrics:
              student_term_count:
                type: count_distinct
                label: "Student Terms"
      - name: student_id
        config:
          meta:
            dimension:
              type: string
              hidden: true
            metrics:
              students_with_records:
                type: count_distinct
                label: "Students"
      - name: school_id
        config:
          meta:
            dimension:
              type: string
              hidden: true
      - name: district_id
        config:
          meta:
            dimension:
              type: string
              hidden: true
      - name: term
        config:
          meta:
            dimension:
              type: string
      - name: school_year
        config:
          meta:
            dimension:
              type: string
      - name: term_start_date
        config:
          meta:
            dimension:
              type: date
              time_intervals: [DAY, MONTH, YEAR]
      - name: term_end_date
        config:
          meta:
            dimension:
              type: date
              time_intervals: [DAY, MONTH, YEAR]
      - name: days_enrolled
        config:
          meta:
            dimension:
              type: number
            metrics:
              total_days_enrolled:
                type: sum
                label: "Days Enrolled"
      - name: days_absent
        config:
          meta:
            dimension:
              type: number
            metrics:
              total_days_absent:
                type: sum
                label: "Days Absent"
              avg_days_absent:
                type: average
                label: "Avg Days Absent per Term"
                round: 1
      - name: suspensions
        config:
          meta:
            dimension:
              type: number
            metrics:
              total_suspensions:
                type: sum
                label: "Suspensions"
      - name: office_referrals
        config:
          meta:
            dimension:
              type: number
            metrics:
              total_office_referrals:
                type: sum
                label: "Office Discipline Referrals"
      - name: absence_rate
        config:
          meta:
            dimension:
              type: number
              format: percent
      - name: is_chronically_absent
        config:
          meta:
            dimension:
              type: boolean
      - name: was_suspended
        config:
          meta:
            dimension:
              type: boolean
      - name: care_status_in_term
        description: "Before Care, In Care, or After Care relative to the student's episodes."
        config:
