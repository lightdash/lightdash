services:
  trino:
    image: trinodb/trino:479
    container_name: ld-trino-dev
    ports:
      - '${TRINO_PORT:-8080}:8080'
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx1G
    volumes:
      - ./etc/catalog:/etc/trino/catalog:ro
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8080/v1/info']
      interval: 5s
      timeout: 3s
      retries: 30
