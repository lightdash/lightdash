services:
  db:
    image: pgvector/pgvector:pg16
    restart: always
    ports:
      - "${AGENT_DB_PORT:-15432}:5432"
    environment:
      POSTGRES_PASSWORD: password
    volumes:
      - agent-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    shm_size: 256m
    deploy:
      resources:
        limits:
          memory: 1G

  rustfs:
    image: rustfs/rustfs:1.0.0
    ports:
      - "${AGENT_RUSTFS_PORT:-19000}:9000"
      - "${AGENT_RUSTFS_CONSOLE_PORT:-19001}:9001"
    volumes:
      # RustFS serves /data (RUSTFS_VOLUMES); mounting elsewhere would leave
      # objects on an anonymous volume that `compose down` drops
      - agent-rustfs-data:/data
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_CORS_ALLOWED_ORIGINS: "*"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M

  rustfs-init:
    image: rustfs/rc:v0.1.36
    depends_on:
      rustfs:
        condition: service_healthy
    volumes:
      - ../docker/init-rustfs.sh:/init-rustfs.sh
    entrypoint: /init-rustfs.sh
    environment:
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_DEFAULT_BUCKETS: default,results
    restart: "no"

  headless-browser:
    image: ghcr.io/browserless/chromium:v2.38.2
    restart: always
    ports:
      - "${AGENT_BROWSER_PORT:-13001}:3000"
    shm_size: 512m
    deploy:
      resources:
        limits:
          memory: 1G

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${AGENT_MAILPIT_WEB_PORT:-18025}:8025"
      - "${AGENT_MAILPIT_SMTP_PORT:-11025}:1025"
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  agent-db-data:
  agent-rustfs-data:
