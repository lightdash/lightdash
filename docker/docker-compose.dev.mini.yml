volumes:
    postgres_data:
    rustfs_data:

services:
    rustfs:
        image: rustfs/rustfs:1.0.0
        ports:
            - '9000:9000'
            - '9001:9001' # console, served at /rustfs/console/
        environment:
            - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY}
            - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY}
            - RUSTFS_CONSOLE_ENABLE=${RUSTFS_CONSOLE_ENABLE:-false}
            # The browser PUTs to presigned URLs directly. The S3 API sends no
            # CORS headers unless this is set.
            - RUSTFS_CORS_ALLOWED_ORIGINS=${RUSTFS_CORS_ALLOWED_ORIGINS:-*}
        volumes:
            - rustfs_data:/data
        healthcheck:
            test: ['CMD', 'curl', '-fsS', 'http://localhost:9000/health']
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 10s

    rustfs-init:
        image: rustfs/rc:v0.1.36
        depends_on:
            rustfs:
                condition: service_healthy
        environment:
            - RUSTFS_ENDPOINT=http://rustfs:9000
            - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY}
            - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY}
            - RUSTFS_DEFAULT_BUCKETS=${RUSTFS_DEFAULT_BUCKETS}
            - RUSTFS_EXPIRATION_DAYS=${RUSTFS_EXPIRATION_DAYS:-1}
        volumes:
            - ./init-rustfs.sh:/init-rustfs.sh
        entrypoint: '/init-rustfs.sh'
        restart: 'no'

    db-dev:
        image: pgvector/pgvector:pg18
        restart: always
        environment:
            POSTGRES_PASSWORD: password
        ports:
            - '5432:5432'
        volumes:
            - postgres_data:/var/lib/postgresql

    headless-browser:
        build:
            dockerfile: Dockerfile.headless-browser
        restart: always
        ports:
            - '3001:3000'

    mailpit:
        image: axllent/mailpit:latest
        restart: unless-stopped
        ports:
            - '8025:8025'
            - '1025:1025'
        environment:
            MP_MAX_MESSAGES: 5000
            MP_SMTP_AUTH_ACCEPT_ANY: 1
            MP_SMTP_AUTH_ALLOW_INSECURE: 1

    nats:
        image: nats:2.11-alpine
        command: ['-js']
        ports:
            - '4222:4222'
            - '8222:8222'
