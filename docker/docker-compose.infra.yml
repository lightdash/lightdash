volumes:
    postgres_data:
    minio_data:
    rustfs_data:

services:
    minio:
        image: coollabsio/minio:latest
        restart: always
        ports:
            - '9000:9000'
            - '9001:9001' # for minio console
        volumes:
            - minio_data:/data
            - ./init-minio.sh:/init-minio.sh
        entrypoint: '/init-minio.sh'
        environment:
            - MINIO_ROOT_USER=${MINIO_ROOT_USER}
            - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
            - MINIO_DEFAULT_BUCKETS=${MINIO_DEFAULT_BUCKETS}
            - MINIO_BROWSER=${MINIO_BROWSER:-off}
            - MINIO_EXPIRATION_DAYS=${MINIO_EXPIRATION_DAYS:-1}

    # RustFS runs alongside MinIO on 9010/9011 for evaluation. Nothing reads
    # from it until S3_ENDPOINT is repointed.
    rustfs:
        image: rustfs/rustfs:1.0.0
        restart: always
        ports:
            - '9010:9000'
            - '9011:9001' # console, served at /rustfs/console/
        volumes:
            - rustfs_data:/data
        environment:
            - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:-rustfsadmin}
            - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY:-rustfsadmin}
            - RUSTFS_CONSOLE_ENABLE=${RUSTFS_CONSOLE_ENABLE:-false}
            - RUSTFS_CORS_ALLOWED_ORIGINS=${RUSTFS_CORS_ALLOWED_ORIGINS:-*}
        healthcheck:
            test: ['CMD', 'curl', '-fsS', 'http://localhost:9000/health']
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 10s

    rustfs-init:
        image: rustfs/rc:v0.1.36
        depends_on:
            rustfs:
                condition: service_healthy
        volumes:
            - ./init-rustfs.sh:/init-rustfs.sh
        entrypoint: '/init-rustfs.sh'
        environment:
            - RUSTFS_ENDPOINT=http://rustfs:9000
            - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:-rustfsadmin}
            - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY:-rustfsadmin}
            - RUSTFS_DEFAULT_BUCKETS=${RUSTFS_DEFAULT_BUCKETS:-default,results,lightdash-apps}
            - RUSTFS_EXPIRATION_DAYS=${RUSTFS_EXPIRATION_DAYS:-1}
        restart: 'no'

    db-dev:
        image: pgvector/pgvector:pg18
        restart: always
        environment:
            POSTGRES_PASSWORD: password
        ports:
            - '5432:5432'
        volumes:
            - postgres_data:/var/lib/postgresql

    ssh-server:
        image: linuxserver/openssh-server:latest
        restart: always
        depends_on:
            - db-dev
        environment:
            - PUID=1000
            - PGID=1000
            - TZ=UTC
            - PUBLIC_KEY=${DEV_SSH_PUBLIC_KEY:-}
            - USER_NAME=sshuser
            - SUDO_ACCESS=true
            - PASSWORD_ACCESS=false
            - LOG_STDOUT=true
        ports:
            - '2222:2222'
        volumes:
            - ./dev-configs/sshd_config:/config/sshd/sshd_config

    headless-browser:
        build:
            dockerfile: Dockerfile.headless-browser
        restart: always
        environment:
            # browserless v2 default session budget is 30s — too short for
            # dev-Vite page loads and the app capture ready-wait (60s).
            - TIMEOUT=180000
        ports:
            - '3001:3000'

    prometheus:
        image: prom/prometheus:latest
        restart: always
        ports:
            - '9091:9090'
        volumes:
            - ./dev-configs/prometheus.dev.yml:/etc/prometheus/prometheus.yml
        command:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--web.console.libraries=/etc/prometheus/console_libraries'
            - '--web.console.templates=/etc/prometheus/consoles'
            - '--storage.tsdb.retention.time=200h'
            - '--web.enable-lifecycle'

    mailpit:
        image: axllent/mailpit:latest
        restart: unless-stopped
        ports:
            - '8025:8025'
            - '1025:1025'
        environment:
            MP_MAX_MESSAGES: 5000
            MP_SMTP_AUTH_ACCEPT_ANY: 1
            MP_SMTP_AUTH_ALLOW_INSECURE: 1

    nats:
        image: nats:2.11-alpine
        command: ['-js']
        ports:
            - '4222:4222'
            - '8222:8222'
