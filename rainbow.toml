# rainbow.toml — how Lightdash runs on Rainbow.
# This file describes the app only (system-description/repo-config.md §4). The
# kernel, network, guest access, paint/warm harnesses and per-env origin and
# secret values are the platform's, not this file's.

# One process: `pnpm dev` runs the common, visualization and warehouses tsc
# watchers, the backend (tsx watch, :8080) and the Vite dev server (:3000).
# The browser hits 8080: the backend serves the production bundle the
# `frontend-build` tier writes to packages/frontend/build, as the Okteto
# preview image did. The dev server stays up but nothing routes to it — the
# bundle is ~180 requests per page against the dev server's ~1,200, and
# that gap is what put the Cypress suites over their ten-second waits
# (SRE-100).
[[app.service]]
name = "dev"
command = "pnpm dev"
ports = [8080, 3000]
serve_port = 8080
restart_on_inject = true           # re-exec on fork to read the injected SITE_URL (see [origin])

# The Snowflake AI OAuth/SDK stub the API tests drive (snowflake-ai-stub in
# docker/docker-compose.preview.yml). Plain node, no deps; it reads only PORT,
# and the recipe's PORT is the backend's, so the stub's is set inline.
[[app.service]]
name = "snowflake-ai-stub"
command = "PORT=3900 node packages/api-tests/stub/snowflake-ai-stub.mjs"
port = 3900
restart_on_inject = true           # re-exec with the fork's injected env, as the dev service does

# Anyone with the URL can open an environment of this repo.
[access]
public = true

[resources]
cpu = 8
memory = "8gb"
max_memory = "16gb"                # headroom the migrate rung and the pnpm install borrow

# node comes from .nvmrc and pnpm from package.json's packageManager. The first
# build step bakes common and warehouses dist into the image so the backend can
# import them — through turbo, so the `frontend-build` rung below (which bakes
# formula, visualization and the bundle the same way, before the migrate rung
# imports them) finds common in the cache; these steps run before the ladder's
# first run rung. From then on the `pnpm dev` watchers keep them current. The
# second is the dbt venv the seed's project compile shells out to (`dbt1.12`).
# Its adapters and pins are dockerfile-prs's: the API and app tests compile
# Snowflake, BigQuery, Databricks and Trino projects with dbt1.12 too.
# The CLI step builds the CLI and links it onto PATH as `lightdash` (tsc does
# not make it executable): the Learn sandbox runs `lightdash` and `dbt` as
# child processes, finds `dbt` in the same venv, and reports itself unavailable
# until both resolve (LearnSandboxService/runtime.ts). The training project's
# sample data compiles with the DuckDB adapter.
[runtime]
system = ["postgresql-18-pgvector", "python3-venv"]  # Postgres 18 as the product databases (pgvector/pgvector:pg18); catalog migrations CREATE EXTENSION vector; the dbt venv
build = [
  "TURBO_TELEMETRY_DISABLED=1 TURBO_NO_UPDATE_NOTIFIER=1 pnpm turbo run build --filter=@lightdash/warehouses",
  "pnpm cli-build && chmod 755 packages/cli/dist/index.js && ln -sf /usr/app/packages/cli/dist/index.js /usr/local/bin/lightdash",
  "python3 -m venv /usr/local/dbt1.12 && /usr/local/dbt1.12/bin/pip install -q 'dbt-core==1.12.0' 'dbt-postgres~=1.10.0' 'dbt-snowflake~=1.12.0' 'dbt-bigquery~=1.12.0' 'dbt-databricks~=1.12.3' 'dbt-trino~=1.10.0' 'dbt-duckdb~=1.10.0' && ln -sf /usr/local/dbt1.12/bin/dbt /usr/local/bin/dbt1.12",
  # The demo dbt project where the Okteto image and the test suites expect it
  # (the backend's default project_dir is /usr/app/dbt).
  "ln -sfn /usr/app/examples/full-jaffle-shop-demo/dbt /usr/app/dbt && ln -sfn /usr/app/examples/full-jaffle-shop-demo/dbt /dbt",
]

[datastores]
postgres = true
minio = true                       # the backend requires S3-compatible storage at boot
mailpit = true                     # catches the mail the backend sends

# The app's own names for the platform's datastores (localhost, fixed dev
# credentials), plus its non-secret dev settings.
[env]
PORT = "8080"
HOME = "/root"                     # the service unit sets no HOME; DuckDB refuses to start without one
NODE_ENV = "development"
# PR mode is what the Okteto previews ran as: the preview flag set and its
# management API, a fixed 000000 email passcode, the relaxed cross-origin
# opener policy, /api/docs. Hot reload is unaffected: it belongs to the dev
# processes, not the mode. packages/backend's dev script defers to a mode
# already set in the environment, so this value reaches the backend.
LIGHTDASH_MODE = "pr"
LIGHTDASH_LOG_LEVEL = "info"
LIGHTDASH_LOG_FORMAT = "json"
SECURE_COOKIES = "true"            # as the Okteto preview: served over https behind an ingress that
TRUST_PROXY = "true"               # sets X-Forwarded-Proto (ingress.go SetXForwarded); iframe embedding needs it
SCHEDULER_ENABLED = "true"
ALLOW_MULTIPLE_ORGS = "true"
HEADLESS = "true"
CI = "true"
PGHOST = "localhost"
PGPORT = "5432"
PGUSER = "postgres"
PGDATABASE = "postgres"
PGMAXCONNECTIONS = "30"            # as the Okteto preview; the API tests run four workers
DBT_DEMO_DIR = "/usr/app/examples/full-jaffle-shop-demo"
DBT_PROJECT_DIR = "/usr/app/examples/full-jaffle-shop-demo/dbt"
S3_ENDPOINT = "http://localhost:9000"
S3_PUBLIC_ENDPOINT = "http://localhost:9000"
S3_REGION = "us-east-1"
S3_BUCKET = "default"
S3_ACCESS_KEY = "minioadmin"
S3_SECRET_KEY = "minioadmin"
S3_FORCE_PATH_STYLE = "true"
APPS_S3_BUCKET = "lightdash-apps"
# Pre-aggregates stay off, as in the Okteto preview: with them on, an embed
# reader's calculate-total was routed to a pre-aggregate whose result lineage
# the AI access check refused (403 ai_access_refused, embedDashboard.test.ts
# "with canExplore"). A product question for the owning team, not a preview
# setting. Enabling them here needs PRE_AGGREGATES_ENABLED,
# PRE_AGGREGATES_PARQUET_ENABLED and PRE_AGGREGATE_RESULTS_S3_{BUCKET,REGION}
# (the same MinIO; DuckDB fetches httpfs through the extensions.duckdb.org
# egress rule below).
EMAIL_SMTP_HOST = "localhost"
EMAIL_SMTP_PORT = "1025"
EMAIL_SMTP_SECURE = "false"
EMAIL_SMTP_USE_AUTH = "false"
EMAIL_SMTP_ALLOW_INVALID_CERT = "true"
EMAIL_SMTP_SENDER_NAME = "Lightdash"
EMAIL_SMTP_SENDER_EMAIL = "noreply@lightdash.local"
# PR mode implies this (docs/preview-feature-flags.md); kept explicit so a
# later mode change cannot silently drop the flag-management API.
LIGHTDASH_PREVIEW_FEATURE_FLAGS_ENABLED = "true"
# No product analytics from previews. The backend's config bakes in a default
# RudderStack write key and data plane, so without these every environment
# tracks into production analytics — and the migrate rung's node process
# stays alive until the client gives up on that request. With the data plane
# outside the egress list that was four TCP timeouts, 8m47s, on every fork.
# RUDDERSTACK_ANALYTICS_DISABLED would be the obvious switch, but it also
# empties health.rudder.writeKey, and the frontend hides the new-user
# onboarding modal when that is undefined (UserCompletionModal.tsx) — the
# Okteto preview carried a key, and space.cy.ts expects the modal. So: a key
# that is not the production one, and a data plane on a local port nothing
# listens on (refused at once, no timeout; the SDK drops the batch).
RUDDERSTACK_WRITE_KEY = "preview-notrack"
RUDDERSTACK_DATA_PLANE_URL = "http://localhost:9"

# Parity with the Okteto previews (docker/docker-compose.preview.yml): the
# settings that switch on the surfaces e2e and QA exercise. Values that name
# a credential are declared under [secrets] below, not here.
IS_PULL_REQUEST = "true"
CUSTOM_ROLES_ENABLED = "true"
MCP_ENABLED = "true"
EMBEDDING_ENABLED = "true"             # the embed specs need it
PERSISTENT_DOWNLOAD_URLS_ENABLED = "true"
GROUPS_ENABLED = "true"
EXTENDED_USAGE_ANALYTICS = "true"
MICROSOFT_TEAMS_ENABLED = "true"
APPS_RUNTIME_ENABLED = "true"          # data apps; the E2B key below makes it usable
ALLOW_MISSING_MIGRATIONS = "true"
# SOFT_DELETE_ENABLED stays unset, as in the Okteto preview: with it on, a
# deleted SQL chart keeps its slug and sqlRunner.test.ts "save & update SQL
# chart" gets 409 reusing it. Cloud runs with soft delete; whether slug reuse
# after a soft delete should work is the owning team's call.
# Postgres wire-protocol server for the semantic layer: setting the port
# starts the listener and renders the project settings page. No TLS certs in
# a preview, and the port stays private to the environment.
PGWIRE_PORT = "5433"
PGWIRE_SSL_MODE = "disabled"
# Ask AI. The copilot follows instance config rather than the preview flag
# set, so it is enabled here and made real by the Anthropic key in [secrets];
# with no key stored it stays off.
AI_COPILOT_ENABLED = "true"
AI_COPILOT_REQUIRES_FEATURE_FLAG = "true"
AI_DEFAULT_PROVIDER = "anthropic"
# The Snowflake AI test loop: the backend accepts only this exact account
# origin and dials it itself, so it is the stub service above.
SNOWFLAKE_AI_TEST_ACCOUNT_URL_ORIGIN = "http://localhost:3900"

# Two seeds, in the order CONTRIBUTING gives them. First the warehouse the
# seeded project points at: dbt loads examples/full-jaffle-shop-demo into the
# `jaffle` schema of the same Postgres. That is scripts/seed-jaffle.sh spelled
# out rather than called, because the script pins dbt1.7 and the image carries
# dbt1.12 — the version the seeded project itself compiles with. Then the
# application database: the org, the admin user, the Jaffle shop project and
# its charts and dashboards; the migrate rung has already run by now.
#
# Both are needed. With only the second, an environment boots looking seeded —
# project, charts and dashboards all present — and every query against it fails
# with `relation "jaffle.orders" does not exist`.
[seed]
run = """
dbt1.12 deps --project-dir examples/full-jaffle-shop-demo/dbt --profiles-dir examples/full-jaffle-shop-demo/profiles &&
dbt1.12 seed --project-dir examples/full-jaffle-shop-demo/dbt --profiles-dir examples/full-jaffle-shop-demo/profiles --full-refresh &&
dbt1.12 run --project-dir examples/full-jaffle-shop-demo/dbt --profiles-dir examples/full-jaffle-shop-demo/profiles --full-refresh --exclude fanouts_sales_targets &&
pnpm -F backend seed"""
env = { LIGHTDASH_LICENSE_KEY = "dummy-build-key" }  # loaded by the config; enables nothing

# Readiness, in the app's own frame. http polls during boot; paints drives
# headless Chrome at the snapshot gate and records first_paint_ms.
[ready]
http = "http://localhost:8080/api/v1/health"
paints = { url = "http://localhost:8080/login", within = "10s", selector = "#root > *" }

[warm]
# The pages the E2E suites open first (the seed project's uuid is fixed by
# the seed). The bundle is prebuilt, so this warms the backend's caches
# rather than a dev server's module graph.
routes = [
  "/", "/login",
  "/projects/3675b69e-8324-4110-bdca-059031aa8da3/home",
  "/projects/3675b69e-8324-4110-bdca-059031aa8da3/dashboards",
  "/projects/3675b69e-8324-4110-bdca-059031aa8da3/spaces",
  "/projects/3675b69e-8324-4110-bdca-059031aa8da3/tables",
  "/projects/3675b69e-8324-4110-bdca-059031aa8da3/sql-runner",
  "/generalSettings",
  "/generalSettings/userManagement",
  "/generalSettings/userAttributes",
  "/generalSettings/projectManagement",
]

# The cache-tier ladder (cache-tiers.md), deepest first; first match wins.
[[tier]]
preset = "pnpm"                    # lockfile globs; egress and memory headroom for the install

# The production bundle the backend serves (dockerfile-prs's build-frontend
# stage). turbo builds formula, common and visualization first — vite
# resolves them from `dist` outside development mode — and skips whatever
# its local cache (.turbo, gitignored, so a fork inherits the parent's)
# already holds, so a frontend-only push rebuilds only the bundle. The
# same rung bakes the dist that `migrate` and `tsoa` import, which the
# old formula-build and common-build rungs did by hand (2026-09-08: both
# died reading a watcher's half-written barrel; a run rung executes with
# the app's units stopped, before any watcher has caught up). Fires on any
# package the bundle contains.
[[tier]]
name = "frontend-build"
files = ["packages/frontend/**", "packages/common/**", "packages/visualization/**", "packages/formula/**"]
run = "pnpm turbo run build --filter=@lightdash/frontend"
env = { NODE_ENV = "production", TURBO_TELEMETRY_DISABLED = "1", TURBO_NO_UPDATE_NOTIFIER = "1" }
memory = "12gb"                    # the common barrel is large; the same headroom migrate takes

# `pnpm dev` runs a tsc watcher over warehouses, so a change to it is a hot
# reload for a serving environment; the backend imports its `dist`, and the
# rungs below run before the watcher has caught up (see frontend-build).
[[tier]]
name = "warehouses-build"
files = ["packages/warehouses/**"]
run = "pnpm warehouses-build"

# The sandbox runs the CLI from its dist and no watcher covers packages/cli.
[[tier]]
name = "cli-build"
files = ["packages/cli/**"]
run = "pnpm cli-build && chmod 755 packages/cli/dist/index.js"

[[tier]]
name = "migrate"
files = ["packages/backend/src/database/migrations/**", "packages/backend/src/ee/database/migrations/**"]
run = "pnpm -F backend migrate"
env = { LIGHTDASH_LICENSE_KEY = "dummy-build-key" }
memory = "12gb"

[[tier]]
name = "api-routes"
files = ["packages/backend/src/controllers/**", "packages/backend/src/ee/controllers/**"]
run = "pnpm -F backend generate-api"   # tsx watch restarts on the regenerated routes.ts
env = { NODE_OPTIONS = "--max-old-space-size=8192" }  # tsoa exceeds the default V8 heap (same as CI)

[[tier]]
name = "app"
watch = ["**"]                     # tsx watch and the tsc watchers notice the write

# Outbound access, exactly these flows and nothing else (the platform builds
# the uplink and a default-deny policy around them). The backend validates its
# licence key online at startup; with no offline certificate stored, Keygen
# must be reachable from every environment, the parent's readiness gate
# included.
[[egress.allow]]
host = "api.keygen.sh"
port = 443

# DuckDB fetches its httpfs extension on first use (pre-aggregate
# materializations and external sources both read and write S3 through it).
# The extension host serves plain http.
[[egress.allow]]
host = "extensions.duckdb.org"
port = 80

# Each integration a preview can exercise, one flow per service. A key in
# [secrets] does nothing on its own: the connect is refused unless the host
# is listed here.
[[egress.allow]]
host = "api.anthropic.com"          # Ask AI, data apps
port = 443

[[egress.allow]]
host = "api.brandfetch.io"          # organization brand lookup
port = 443

[[egress.allow]]
host = "api.e2b.dev"                # data-app sandboxes (control plane only; sandbox hosts are per-run)
port = 443

[[egress.allow]]
host = "api.github.com"             # GitHub App: repo access for dbt projects
port = 443

# Runtime dbt deps needs the registry and the GitHub archive redirect destination.
[[egress.allow]]
host = "hub.getdbt.com"
port = 443

[[egress.allow]]
host = "codeload.github.com"
port = 443

# BigQuery (the warehouse test suites): the API and the token endpoint.
[[egress.allow]]
host = "bigquery.googleapis.com"
port = 443

[[egress.allow]]
host = "oauth2.googleapis.com"
port = 443

[[egress.allow]]
host = "www.googleapis.com"
port = 443

# Certificate revocation checks the Snowflake driver makes (fail-open when
# refused, but each refusal waits out a timeout first).
[[egress.allow]]
host = "ocsp.snowflakecomputing.com"
port = 80

[[egress.allow]]
host = "ocsp.digicert.com"
port = 80

# Staging warehouses, by secret (see [secrets]).
[[egress.allow]]
host_secret = "WAREHOUSE_POSTGRES_HOST"
port = 5432

[[egress.allow]]
host_secret = "WAREHOUSE_SNOWFLAKE_HOST"
port = 443

[[egress.allow]]
host_secret = "WAREHOUSE_DATABRICKS_HOST"
port = 443

[[egress.allow]]
host_secret = "WAREHOUSE_TRINO_HOST"
port = 443

[[egress.allow]]
host = "github.com"                 # GitHub OAuth login
port = 443

# The app learns its public origin the truthful way: SITE_URL is injected on
# fork and the dev service re-execs to read it (restart_on_inject above), so
# every URL the backend emits — invite links, embed and OAuth redirects, the
# health payload — is the preview's, not localhost. A patch rule here would
# switch Rainbow to patch mode (one response corrected in flight, no restart)
# and the E2E suites that read those URLs would fail again.
[origin]
vars = ["SITE_URL"]

# Names, not values: the platform holds what they resolve to, and every
# environment of this repo has them from the moment it boots. A name with no
# stored value is simply absent (a kind the platform knows gets a placeholder
# so the app can boot with nothing set). The licence pair is the offline
# (ed25519-signed) form, so it verifies locally without reaching
# api.keygen.sh; until both are stored, previews run Community Edition.
[secrets]
LIGHTDASH_SECRET = "app-secret"
PGPASSWORD = "postgres-password"
LIGHTDASH_LICENSE_KEY = "licence"
LIGHTDASH_LICENSE_CERTIFICATE = "licence"
# Staging warehouses the test suites connect projects to. The hosts are
# secrets so this public file never carries their addresses; the matching
# [[egress.allow]] rules below name them by secret.
WAREHOUSE_POSTGRES_HOST = "host"
WAREHOUSE_SNOWFLAKE_HOST = "host"
WAREHOUSE_DATABRICKS_HOST = "host"
WAREHOUSE_TRINO_HOST = "host"
# Integrations, in the order of the [[egress.allow]] list. Each is optional:
# with no value stored the variable is absent and the feature stays off.
ANTHROPIC_API_KEY = "api-key"
BRANDFETCH_API_KEY = "api-key"
E2B_API_KEY = "api-key"
GITHUB_APP_ID = "github-app"
GITHUB_APP_NAME = "github-app"
GITHUB_CLIENT_ID = "github-app"
GITHUB_CLIENT_SECRET = "github-app"
GITHUB_PRIVATE_KEY = "github-app"
